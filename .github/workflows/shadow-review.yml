name: Shadow review

# Post-merge advisory review of a PR that merged into main WITHOUT going through
# Codex review — i.e. one that carried neither `risk:high` nor `review:requested` at
# merge time. `github.event.pull_request.labels` on a `closed` event is the label
# snapshot at that instant, which IS "at merge time" — no separate lookup needed.
# docs/specs/risk-based-review/plan.md, "Measurement": this is the direct signal
# scripts/review-outcomes.ts's file-overlap heuristic was always meant to stand in for.
#
# Selection is by LABEL on purpose, not a recomputed risk-list replay: this review is
# advisory only — it files what it finds and never blocks (see the "report" job below)
# — so a wrongly-removed `risk:high` label only costs a redundant review, never a risky
# PR shipping unwatched. That asymmetry is what makes label-based selection safe here;
# it would NOT be safe if this workflow ever gated a merge, so it must not become one.
#
# TWO JOBS, deliberately, over one trust boundary:
#
#   analyze (contents: read, pull-requests: read — no write scope at all) runs the
#   model. A no-checkout design was tried and does NOT work: the action calls
#   `restoreConfigFromBase()` unconditionally on any PR-shaped context — this
#   `pull_request_target` event sets `isPR: true` for every `types` value, not
#   just `opened`/`synchronize` (`src/github/context.ts:191-200`), and
#   `run.ts:263-274` calls it whenever `isPR` is true, before Claude starts. That
#   function's `listTrackedPaths()` shells out to `git diff`/`git ls-files` with
#   no try/catch (`src/github/operations/restore-config.ts:51-81`), which throws
#   in a workspace with no `.git` — confirmed by running that exact command by
#   hand outside a repo (exit 129, "Not a git repository") and, for contrast,
#   inside a real `fetch-depth: 1` checkout of a merge-commit SHA, where the
#   whole restore-config command sequence (`git diff --name-only -z ... HEAD --`,
#   `git ls-files -z`, `git fetch origin main --depth=1 --no-recurse-submodules`,
#   `git checkout origin/main -- <path>` per path, `git reset -- <paths>`) ran
#   clean end to end. So `analyze` DOES check out `merge_commit_sha`
#   (`fetch-depth: 1`, `persist-credentials: false`) — `gh pr diff` still
#   supplies the actual diff text (works for every merge method, closed or
#   open), and the checkout exists only so the action's own machinery has a
#   `.git` to run its restore against and so Claude can read
#   `docs/review-policy.md` locally, at the exact merge-commit version. This
#   repo is private, so `restoreConfigFromBase`'s `git fetch origin main` needs
#   auth: `run.ts:229-236` runs `prepareAgentMode` (which authenticates the
#   remote via `configureGitAuth`, see below) BEFORE `run.ts:263-274` calls
#   `restoreConfigFromBase`, so that fetch is already authenticated by the time
#   it runs.
#
#   The checkout DOES put PR-controlled config on disk — `.claude/settings.json`
#   (hooks), `.mcp.json` (a server the action auto-trusts via
#   `enableAllProjectMcpServers: true`, set unconditionally,
#   `base-action/src/setup-claude-code-settings.ts:62-64`), CLAUDE.md,
#   CLAUDE.local.md, `.ripgreprc`, etc. — none of which a tool-permission list
#   like `--disallowedTools Bash` gates, since hooks and MCP servers aren't
#   tools; they run on session start, before any tool-permission check. Three
#   layers close this, not one:
#   1. The action's OWN defense: `restoreConfigFromBase()` (triggered as above)
#      overwrites `restore-config.ts`'s exact `SENSITIVE_PATHS` list — `.claude`,
#      `.mcp.json`, `.claude.json`, `.gitmodules`, `.ripgreprc`, `CLAUDE.md`,
#      `CLAUDE.local.md`, `.husky` (`restore-config.ts:26-35`) — with the
#      current `origin/main` version of each BEFORE Claude reads anything
#      (`restore-config.ts:234-240`'s own docstring: the CLI "reads `.mcp.json`,
#      `.claude/settings.json`, and `.claude/settings.local.json` from the
#      working directory and acts on them before any tool-permission gating —
#      executing hooks ... auto-approving MCP servers"). For a closed/merged PR
#      the checked-out `merge_commit_sha` and `origin/main` are the same trust
#      level (both already-merged code), so this isn't the open-PR "restore to
#      the pre-merge trusted state" case — it's a no-op-ish restore here, and
#      not load-bearing for us on its own.
#   2. `--setting-sources user` in `claude_args`: drops the `'project'` source
#      (`.claude/settings.json`, hooks) and CLAUDE.md — the SDK's own doc
#      comment is explicit: "Must include 'project' to load CLAUDE.md files"
#      (`@anthropic-ai/claude-agent-sdk` `sdk.d.ts:2076-2085`). Empirically
#      verified this flag ALSO suppresses `.mcp.json` at CLI 2.1.268 (the exact
#      version this action installs, `run.ts:80`): a scratch `.mcp.json`
#      server whose `command` touched a marker file was spawned (marker
#      created) with default `settingSources`, and never spawned (no marker,
#      reproduced twice) with `--setting-sources user` alone, both runs
#      otherwise identical (same `.mcp.json`, same unauthenticated `HOME`).
#   3. `--strict-mcp-config` in `claude_args` anyway, belt-and-braces: its own
#      doc names `.mcp.json` as a config source it independently blocks
#      (`sdk.d.ts:2127-2134`), and it costs nothing to keep both.
#   With all three, whatever ends up on disk — restored-from-base or, if that
#   somehow failed, still the PR's own — is inert to the model regardless.
#   (`.claude/**`, `.mcp.json`, `.claude.json`, `.gitmodules`, `.ripgreprc` are
#   also on `risk:high`/`risk:gates` in `.github/labeler.yml` — this workflow
#   neutralizes them for ITS OWN reviewer via the layers above, but nothing
#   protects a PR that reaches a checkout-based agent session elsewhere in this
#   fleet. CLAUDE.local.md is on `restore-config.ts`'s `SENSITIVE_PATHS` too but
#   NOT on the labeler list: `.gitignore:29` (`**/CLAUDE.local.md`) means it can
#   never appear in a PR diff, so that rule would never fire. Plain CLAUDE.md is
#   also not on the list: it changes often enough that flagging every edit has a
#   real review cost, and layer 2 above fully covers it for this reviewer.)
#
#   `gh pr diff` itself has a documented ceiling: GitHub's diff API refuses a
#   sufficiently large diff (HTTP 406). A PR that large gets no shadow review —
#   loudly, as a failed `analyze` run visible in the Actions tab, never silently
#   — which is the intended trade over guessing at a partial diff.
#
#   Also unconditionally: `configureGitAuth`/`replaceCheckoutCredentials`
#   (`src/github/operations/git-config.ts:129-134`) embeds the action's own
#   token into `.git/config`'s remote URL — readable by the model's Read tool
#   straight out of this checkout. This is why the token this job passes
#   (`github_token: ${{ github.token }}`, this job's own
#   `contents: read, pull-requests: read` token — no issues/pull-requests WRITE)
#   is the least damaging one that leak could expose, and why `report` (below)
#   scrubs the findings before posting. `github_token` also short-circuits
#   `setupGitHubToken()` (`src/github/token.ts:158-165`) before it reaches
#   `getOidcToken()` (`:56-66`), so `id-token: write` is never needed.
#
#   report (contents: read, issues: write, pull-requests: write — no model) is the
#   ONLY step that calls the GitHub write API, and the ONLY job holding a
#   write-capable token — `analyze`'s own `GITHUB_TOKEN` is read-only AND, like
#   every job's default token, expires when that job ends, before `report` even
#   starts (GitHub Actions: a job's `GITHUB_TOKEN` is minted per job and is valid
#   only for that job's duration). So the split alone already keeps a
#   write-capable credential out of reach of the model and anything it produces.
#   The token-shaped-string scrub below, before `report` posts anything, is
#   defense in depth on top of that — for a credential from somewhere else
#   entirely (e.g. one a prompt injection tries to fabricate or reference) — not
#   the primary control.
#
# Trust boundary: `pull_request_target` runs both jobs with repo secrets and a
# write-capable default token regardless of who opened the PR. Never check out
# `github.event.pull_request.head.sha` here — only ever `merge_commit_sha`, a commit
# already reachable from `main` through a merge GitHub performed.
#
# `analyze` uses the `prompt` input, which runs the action's "agent mode"
# (`src/modes/agent/index.ts`); that mode calls `checkHumanActor` unconditionally
# (`index.ts:30`, `src/github/validation/actor.ts`) and throws if `github.actor` — the
# account that closed/merged the PR — resolves to a non-`User` account not on
# `allowed_bots` (unset here, so no bot is allowed). Checked against this repo's last
# several merges (`gh api repos/.../pulls/<n> --jq '.merged_by'`): every one was
# `davekim917`, type `User`, so this passes today. If merges here start happening
# through a bot identity, this job fails loudly (visible in the Actions tab) rather
# than silently — the fix is `allowed_bots: <bot-login>` on the `analyze` step, not a
# workaround here.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: shadow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'risk:high') &&
      !contains(github.event.pull_request.labels.*.name, 'review:requested')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.review.outputs.structured_output }}
      failure_reason: ${{ steps.failure-reason.outputs.reason }}
    steps:
      # merge_commit_sha, never head.sha (see the trust-boundary note above). This
      # ref is already reachable from main, so nothing here executes PR-authored
      # code that wasn't already merged. Required so the action's own
      # restoreConfigFromBase() has a `.git` to run against — see the top-of-file
      # comment for why a no-checkout design doesn't work here, and for the three
      # layers (this restore, --setting-sources user, --strict-mcp-config) that
      # keep whatever lands in this checkout inert to the model.
      - name: Checkout the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      # gh pr diff, not a local git diff: works for every GitHub merge method
      # (merge, squash, rebase) and for an already-closed PR — verified against
      # this repo's own #643, merged and closed, from a plain non-repo directory —
      # where HEAD~1 would only be correct for some of those methods.
      - name: Fetch the PR's diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$REPO" > "$RUNNER_TEMP/shadow-review.diff"
          bytes=$(wc -c < "$RUNNER_TEMP/shadow-review.diff")
          # Cap at 400KB (~100k tokens) so one unusually large PR can't blow the
          # review's context or its cost; it still gets a review, just a partial one.
          if [ "$bytes" -gt 400000 ]; then
            head -c 400000 "$RUNNER_TEMP/shadow-review.diff" > "$RUNNER_TEMP/shadow-review.diff.trunc"
            printf '\n... TRUNCATED at 400000 of %s bytes — review the visible portion only.\n' "$bytes" \
              >> "$RUNNER_TEMP/shadow-review.diff.trunc"
            mv "$RUNNER_TEMP/shadow-review.diff.trunc" "$RUNNER_TEMP/shadow-review.diff"
          fi

      # This reviewer runs the Claude frontier model — the same id
      # container/skills/pr-review-loop/scripts/codex-review.sh gates review
      # receipts on. Resolved from `FRONTIER_MODELS` in scripts/reviewer-models.ts
      # (the roster), not from the generated
      # container/skills/pr-review-loop/reviewer-models.txt allowlist: that file
      # unions both vendors AND the prior-id receipt-compatibility tier
      # (`COMPATIBLE_RECEIPT_MODELS`, reviewer-models.ts:45), so it cannot say
      # which single id is the current Claude frontier one.
      #
      # This step used to read container/agents/worker-high.md's `model:`
      # frontmatter and reimplement the generator's frontmatterOf() /
      # extractScalar() in bash. Both ends of that are gone. The generator no
      # longer derives anything — its ids are stated in the file, and its own
      # docstring says why (reviewer-models.ts:8-15): delegation is now a set of
      # effort shims carrying `model: inherit`, and an alias is exactly what
      # `assertConcreteModelId` refuses, so no live agent file names a concrete
      # frontier model any more. `container/agents/worker-high.md` did not exist
      # on `main` even before #866 (main carried only worker-frontier.md), so this
      # step has never resolved from `main`; #866 emptied the directory, so it
      # never could.
      #
      # Read from the PR's BASE sha via the Contents API, never the merge commit
      # that is about to be checked out: a PR could otherwise edit the roster in
      # the same commit to pick which model reviews it — the same
      # contents-API-from-base pattern codex-review.sh's repo_mode() uses for
      # labeler.yml.
      - name: Resolve the Claude reviewer model
        id: reviewer_model
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ROSTER="scripts/reviewer-models.ts"
          content=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/$ROSTER?ref=$BASE_SHA")

          # Normalize CRLF/lone-CR line endings before anything looks at line
          # breaks. This step has no Node/tsx runtime, so the roster is read as
          # text — hence the three normalizations below.
          content=$(printf '%s' "$content" | tr -d '\r')

          # 1. Strip comments BEFORE the array is located — `//` to end of line
          #    first, then `/* … */` once the text is one line. A commented-out
          #    id is not part of the roster: without this, an operator pausing
          #    the Claude reviewer by commenting its id out still had that id
          #    resolved and used, in EITHER comment style. Model ids contain
          #    neither delimiter, so nothing real is lost.
          #
          #    This is TEXT stripping, not a parse, and there is ONE rule
          #    behind every edge case below. `/*`, `*/` and `//` are comment
          #    delimiters wherever they appear, string literals included; and
          #    a `/*` left orphaned — because a `//` on its line ate its `*/`,
          #    or because it was never a comment at all, like the `/*` inside
          #    a `'**/*.ts'` glob — does not stay orphaned. It pairs with the
          #    NEXT `*/` anywhere later in the flattened file, and everything
          #    between the two disappears.
          #
          #    So the failure is: a declaration that sits between an orphaned
          #    `/*` and some later `*/` is invisible to this step. If another
          #    declaration follows, THAT one resolves — silently, exit 0, with
          #    the delimiters balanced so the check below sees nothing wrong.
          #    If none follows, it fails closed as "found 0". No `//` is
          #    required: a pair of ordinary globs does it, and so does a glob
          #    followed by any later docblock.
          #
          #    Not fixed here, because fixing it means parsing rather than
          #    stripping, which needs a Node/tsx runtime this step does not
          #    have. What bounds it: the real roster
          #    (`scripts/reviewer-models.ts`) has no `http`, no glob and no
          #    such literal; it is read at the PR's BASE sha, so landing one
          #    takes a merged commit; and the roster is one short file whose
          #    whole job is to name reviewers.
          # 2. Flatten to a single line, so the array literal can be matched as
          #    one expression whether it is written on one line or wrapped over
          #    several.
          flat=$(printf '%s\n' "$content" | sed -E 's;//.*$;;' | tr '\n' ' ')
          # A block comment becomes a SPACE, not nothing: deleting it outright
          # would let `…['a']/**/const FRONTIER_MODELS=['b']` fuse into one
          # token and hide the second declaration from the duplicate check.
          flat=$(printf '%s' "$flat" | sed -E 's;/\*([^*]|\*+[^*/])*\*+/; ;g')
          # A delimiter surviving the strip means some `/*` or `*/` had no
          # partner anywhere in the file, so the text no longer means what the
          # matching below assumes. Refuse rather than resolve from it.
          #
          # Be clear about what this does and does not buy, because the
          # tempting reading is that it closes step 1's hole. It does not.
          # It is the LAST-RESORT half of that one rule: an orphaned `/*` is
          # caught here only when NO `*/` follows it in the whole file. When
          # one does follow — another docblock further down, a second glob —
          # the two pair up, the delimiters come out balanced, this check sees
          # nothing, and step 1's silent wrong-id case is live. On this roster
          # `FRONTIER_MODELS` is declared above several docblocks, so a `*/`
          # to pair with is always available: treat step 1's bound (the roster
          # is short, reviewed, and read at the base sha) as the real defence
          # and this check as a backstop for the no-partner case only.
          #
          # What it does refuse is legitimate TypeScript, all fail-CLOSED:
          # a one-line `/* … https://… */` or a docblock whose LAST line holds
          # the URL (the `//` eats that line's `*/`; a `//` AFTER the `*/`, or
          # a URL on a middle line, is fine), and a trailing glob like
          # `'**/*.ts'` with no later `*/`. The message names the delimiter
          # and the fix, because "unbalanced" alone sends the reader looking
          # for a broken comment when the cause is a URL or a glob.
          if printf '%s' "$flat" | grep -qE '/\*|\*/'; then
            echo "unresolved /* or */ after comment-stripping $ROSTER@$BASE_SHA — refusing to resolve a reviewer from text this step cannot account for." >&2
            echo "Usual cause: a URL or other '//' on the SAME line as a block comment's '*/' (that '//' deletes the '*/'), or an unpaired '/*' or '*/' inside a string literal such as a '**/*.ts' glob." >&2
            echo "Fix in $ROSTER: move the URL off the closing line of the comment, or keep such literals out of this file." >&2
            exit 1
          fi

          # 3. The FRONTIER_MODELS array literal: the declaration, then
          #    everything from the `[` that opens the array to the FIRST `]`
          #    after it, so no later array (COMPATIBLE_RECEIPT_MODELS in
          #    particular) can leak in. Anchoring the bracket scan AFTER the `=`
          #    is what keeps a `readonly string[]` annotation from being
          #    mistaken for the array's own closing bracket. A `]` INSIDE an id
          #    (a stray `[1m]` suffix) still truncates the literal there, so
          #    such a roster fails below as "found 0" rather than by name —
          #    imprecise, but fail-closed: no `[1m]` id reaches the reviewer.
          #
          #    Reading `decl` left to right, each piece and what it guards:
          #      `(^|[^A-Za-z0-9_$])` — the char before `const` is not an
          #        identifier char, so `myconst`/`$const` cannot match.
          #      `const[[:space:]]+FRONTIER_MODELS` — this is what already
          #        rejects a LONGER name ending in the target, e.g.
          #        `NEXT_FRONTIER_MODELS`.
          #      `[[:space:]]*(:[^=;]*)?=` — the name is followed only by
          #        optional space, an optional type annotation, and then the
          #        `=`. This is the bound that was MISSING: without it,
          #        `FRONTIER_MODELS_PREVIOUS = [...]` declared above the real
          #        one matched, `head -n 1` took it, and the job reviewed with a
          #        superseded model and exited 0. Excluding `;` from the
          #        annotation keeps it from running past a bare
          #        `declare const FRONTIER_MODELS: readonly string[];` into a
          #        different declaration's array.
          # 4. Every match is counted, not just the first: two declarations that
          #    both satisfy the pattern mean the roster carries a choice this
          #    step is not entitled to make silently, so it fails rather than
          #    taking whichever comes first.
          decl="(^|[^A-Za-z0-9_\$])(export[[:space:]]+)?const[[:space:]]+FRONTIER_MODELS[[:space:]]*(:[^=;]*)?=[[:space:]]*\[[^]]*\]"
          matches=$(printf '%s' "$flat" | grep -oE "$decl" || true)
          decl_count=$(printf '%s\n' "$matches" | grep -cE 'FRONTIER_MODELS' || true)
          if [ "$decl_count" -ne 1 ]; then
            echo "expected exactly one FRONTIER_MODELS array literal in $ROSTER@$BASE_SHA, found $decl_count" >&2
            exit 1
          fi
          array="$matches"

          # Every quoted string inside that literal, one per line, unquoted.
          # `grep` exits 1 on no match and pipefail would make that the whole
          # pipeline's status, so each is `|| true`-guarded to let the
          # count check below report the real problem instead of the step
          # aborting silently before it.
          ids=$(printf '%s' "$array" | grep -oE "'[^']*'|\"[^\"]*\"" | sed -E "s/^['\"]//; s/['\"]\$//" || true)
          claude_ids=$(printf '%s\n' "$ids" | grep -E '^claude-' || true)

          # Exactly one, or fail loudly. Zero means the roster moved or renamed
          # its Claude id; more than one means the roster now carries a choice
          # this step is not entitled to make silently.
          count=$(printf '%s\n' "$claude_ids" | grep -c '^claude-' || true)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one claude-* id in FRONTIER_MODELS at $ROSTER@$BASE_SHA, found $count" >&2
            exit 1
          fi
          model=$(printf '%s\n' "$claude_ids" | head -n 1)

          # Reject anything that isn't a bare model id, matching
          # assertConcreteModelId's two checks in scripts/reviewer-models.ts:73-82
          # — a bare alias with no digit ("opus", "sonnet", "inherit"), and any
          # shape that isn't purely id characters (a `[1m]` suffix, a trailing
          # comment, extra words). The generator asserts both when it runs, but
          # this reads the roster as TEXT at an arbitrary base sha, so it
          # re-checks rather than trusting that the generator ran there.
          case "$model" in
            *[0-9]*) ;;
            *)
              echo "$model is not a concrete versioned model id (from FRONTIER_MODELS at $ROSTER@$BASE_SHA)" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$model" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "$model is not a bare model id (from FRONTIER_MODELS at $ROSTER@$BASE_SHA)" >&2
            exit 1
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"

      # Read-only reviewer of a checkout whose sensitive paths the action has
      # already restored from origin/main, further locked down by
      # --setting-sources user (project settings + CLAUDE.md) and
      # --strict-mcp-config (.mcp.json) — see the top-of-file comment for the
      # three-layer defense this rests on. No Bash/Write/Edit: the model never
      # runs a command or writes a file. --json-schema turns the review into one
      # validated `structured_output` field this job exposes as an output — the
      # model never touches the GitHub write API either way.
      - name: Shadow review
        id: review
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1.0.221
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the shadow reviewer defined in docs/specs/risk-based-review/plan.md.
            PR #${{ github.event.pull_request.number }} merged into main WITHOUT a Codex
            review, because it did not touch a path on the risk list
            (.github/labeler.yml). Review it anyway, after the fact. This is advisory
            only — you never block anything, you only report what you find.

            1. Read docs/review-policy.md in this checkout (at the merge commit) for
               the severity contract: what counts as a real finding, what its
               "Blocks — destructive" bar names, and what "Do not report" excludes.
            2. Read the PR's diff at ${{ runner.temp }}/shadow-review.diff — this is
               the change to review; do not review the rest of the checkout, which is
               present only so the review policy above and this workflow's own
               machinery have real files to work with.
            3. Classify each real finding:
               - **P1** — it matches the "Blocks — destructive" bar (data
                 loss/corruption; money computed, moved or reported wrong; tenant or
                 scope isolation breached; auth or permission bypassed; credentials
                 exposed; a migration with no undo) OR is a fail-open in a security or
                 safety control.
               - **P2** — any other real, notable bug.
               Do NOT report anything the policy's "Do not report" section excludes
               (generated files, style a formatter already enforces, pre-existing
               defects outside this diff, anything a deterministic gate already
               covers).
            4. If nothing is worth reporting, return an empty findings array — do not
               manufacture a finding to have something to say.

            Cite file:line for every finding, and name the class it belongs to. Be
            precise and conservative: this feeds a program that moves a PR's paths onto
            the mandatory-review list on a real P1, so a false P1 has a real cost.
          claude_args: |
            --model ${{ steps.reviewer_model.outputs.model }}
            --setting-sources user
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Write,Edit,WebSearch,WebFetch"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["P1","P2"]},"file":{"type":"string"},"line":{"type":["integer","null"]},"class":{"type":"string"},"description":{"type":"string"}},"required":["severity","file","description"]}}},"required":["findings"]}'

      # Steps with no explicit `shell:` run as `bash -e {0}`
      # (actions/runner `ScriptHandlerHelpers.cs:19`) — errexit is on regardless of
      # what `set` says, so every command here that can legitimately fail is
      # either inside an `if`/`case` test (exempt from `-e`) or explicitly
      # `|| ...`-guarded. `set -uo pipefail` still adds real value on top of that:
      # `-u` catches an unset-variable typo, and `pipefail` makes a failing `gh`
      # inside a pipe abort the pipeline instead of silently succeeding on `wc`'s
      # exit code.
      #
      # The action hides the model's actual result/error text from normal logs by
      # design (`sanitizeSdkOutput`, `base-action/src/run-claude-sdk.ts:117-160`,
      # only prints a sanitized summary — subtype/is_error/duration/cost/turns —
      # never the text itself). But it always writes the full, unsanitized SDK
      # message transcript to `$RUNNER_TEMP/claude-execution-output.json`
      # (`base-action/src/execution-file.ts:6,8-13,15-32`: one JSON array, written
      # by `writeExecutionFile` before the run either returns or re-throws,
      # `run-claude-sdk.ts:186,213-214,222`). The pinned action returns right
      # after writing a result message (`run-claude-sdk.ts:190-209`), so on a
      # normal completion the result IS the last array entry — but an
      # SDK-THROW path (an error before any result forms) writes the
      # transcript up to whatever message came last and then throws with NO
      # result message in it at all, so blindly reading `.[-1]` could pick up
      # some other message type and misread its fields as if they were
      # `.result`/`.errors`. Filtering for `type=="result"` explicitly (and
      # taking the last match, since only one should ever exist) avoids that;
      # when none exists at all, the `$r == null` branch below reports it
      # plainly instead. On `SDKResultSuccess`
      # (subtype "success", `sdk.d.ts` ~4999-5040) `.result` carries the final
      # assistant text OR, when `is_error` is true, "the error text when the turn
      # ended on an API error" (the type's own doc comment); on `SDKResultError`
      # (`sdk.d.ts` ~4957-4988, the max-turns/max-budget/max-structured-output-
      # retries/during-execution subtypes) there is no `.result` field at all,
      # only `errors: string[]`. jq's `//` treats only `false`/`null` as absent,
      # NOT `""`, so an empty `.result` string is folded into "absent" explicitly
      # before falling back to `.errors`; a final fallback covers no result
      # message at all (a failure before `runClaudeWithSdk` ran, e.g.
      # `checkHumanActor`, `restoreConfigFromBase`, CLI install), and `|| true`
      # after the whole substitution stops a jq parse error on a malformed/
      # truncated file from aborting the step under `-e` before REASON's own
      # empty-string fallback below gets a chance to run.
      - name: Report the failure reason
        id: failure-reason
        if: failure()
        run: |
          set -uo pipefail
          FILE="${{ runner.temp }}/claude-execution-output.json"
          if [ ! -f "$FILE" ]; then
            REASON="no execution output was written — the run failed before Claude started"
          else
            REASON=$(jq -r '
              ([.[] | select(.type=="result")] | last) as $r
              | if $r == null then "no result message recorded in the execution output"
                else
                  ( ($r.result // "") as $res
                    | if $res != "" then $res
                      else ( (($r.errors // []) | join("; ")) as $errs
                        | if $errs != "" then $errs
                          else "result message present but no result/errors field"
                          end
                      )
                      end
                  )
                end
            ' "$FILE" 2>/dev/null) || true
            if [ -z "$REASON" ]; then
              REASON="could not parse the execution output"
            fi
          fi
          # Flatten to one line and cap length before it goes anywhere (step
          # summary, a later job output, potentially a PR comment via `report`).
          REASON=$(printf '%s' "$REASON" | tr -d '\r' | tr '\n' ' ' | cut -c1-300)
          # Same known-token-prefix scrub as `report` — see that job for why a
          # generic secret-shape heuristic isn't used.
          if printf '%s' "$REASON" | grep -qE 'ghs_|ghp_|gho_|ghu_|ghr_|github_pat_|sk-ant-'; then
            REASON="[redacted: the raw error text contained a token-shaped string]"
          fi
          echo "Shadow review failed. Reason: $REASON"
          {
            echo "## Shadow review failed"
            echo ""
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

  report:
    needs: analyze
    # `always()` bypasses the implicit `success()` gate `needs:` puts on this job,
    # so it isn't itself skipped by `analyze` failing — but it must still respect
    # the same selection predicate `analyze` used (so an unselected PR's `report`
    # doesn't fire just because `always()` is present), AND only proceed when
    # `analyze` actually ran to a real conclusion: 'success' is the normal path,
    # 'failure' and 'cancelled' both take the failure path below (see that step),
    # and 'skipped' is the only one that leaves this job skipped too.
    # `cancelled` is treated as a real failure signal, not a benign no-op: the
    # merged PR that triggered this run can't be reopened, so this workflow's own
    # `concurrency: cancel-in-progress` (scoped to the PR number) never cancels a
    # merged PR's run — nothing about this workflow's design produces a
    # `cancelled` `analyze` in normal operation. A `cancelled` result here means a
    # manual cancel or an infrastructure interruption, and either way no review
    # ran, which is exactly the silent-failure mode this job exists to surface.
    if: >-
      always() &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'risk:high') &&
      !contains(github.event.pull_request.labels.*.name, 'review:requested') &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'failure' || needs.analyze.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Idempotent: creates the label on first run, no-ops (via --force, which updates
      # rather than errors) on every run after. Each create is `|| echo ::warning`
      # rather than left to fail the step outright: under `bash -e` (see the note in
      # `analyze`'s "Report the failure reason" step), an unguarded transient 5xx on
      # the FIRST create would abort the step before the others ran, and — with no
      # `always()` — silently skip both steps below it too, since their `if:` is
      # implicitly ANDed with this step's `success()`.
      - name: Ensure the shadow-review labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh label create shadow-review \
            --repo "$REPO" \
            --color 5319E7 \
            --description "Findings from a post-merge advisory review of a PR that merged without review" \
            --force \
            || echo "::warning::could not create the shadow-review label"
          gh label create shadow-review-failed \
            --repo "$REPO" \
            --color B60205 \
            --description "This merge has no shadow review on record: analyze errored, was cancelled, or filing failed" \
            --force \
            || echo "::warning::could not create the shadow-review-failed label"
          gh label create shadow-reviewed \
            --repo "$REPO" \
            --color 0E8A16 \
            --description "This PR was reviewed by the post-merge shadow-review workflow, clean or with findings" \
            --force \
            || echo "::warning::could not create the shadow-reviewed label"

      # analyze errored, or was cancelled, before Claude produced a result. Either
      # way this merge gets neither an issue nor a clean-review comment — say so
      # explicitly, once, rather than let it read as silently clean, and label it
      # failed. Adds shadow-review-failed ONLY — never removes shadow-reviewed:
      # this step has no way to know whether an EARLIER run already reviewed this
      # PR successfully, and a failed re-run (e.g. someone re-running all jobs on
      # an old, already-reviewed PR) must not erase that history.
      # `scripts/review-outcomes.ts`'s classifyShadowReview() encodes the resulting
      # precedence: reviewed wins over failed, so a PR that carries both labels
      # (this one, plus a stale shadow-reviewed from before) still reads as
      # reviewed. On a cancel, analyze's own `if: failure()` "Report the failure
      # reason" step never runs (cancellation isn't a step failure), so
      # `failure_reason` is unset here — substitute the literal "(cancelled)"
      # rather than falling through to a generic "unknown reason" that would look
      # like an unread execution-output file when actually nothing ran long enough
      # to produce one.
      #
      # `if: always() && (...)`, not a bare `(...)`: without `always()` this step's
      # condition is implicitly ANDed with `success()` of every prior step in this
      # job, so a transient failure in "Ensure the shadow-review labels exist"
      # (hardened above, but defense in depth) would otherwise skip this step too —
      # exactly the silent-failure shape this workflow exists to prevent, one job
      # over. Never itself fails the job a second time: every write is tolerated,
      # and the step always exits 0.
      - name: Report that analyze failed
        if: always() && (needs.analyze.result == 'failure' || needs.analyze.result == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          REASON: ${{ needs.analyze.outputs.failure_reason }}
        run: |
          set -uo pipefail
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label shadow-review-failed \
            || echo "::warning::could not label #$PR_NUMBER shadow-review-failed"

          # Idempotent across retries of this job: skip if already posted. `--jq`
          # under `--paginate` runs the filter once PER PAGE, not once over the
          # combined result set — a `| length` here would silently break on a PR
          # with more than one page of comments (a multi-line count, `[ -gt 0 ]`
          # erroring on the second line under `-e`, and a duplicate comment
          # getting posted). Emitting one matching id per line instead makes
          # multi-page output concatenate correctly, and `wc -l` counts the total
          # regardless of how many pages contributed.
          MARKER="Shadow review could not run"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null \
            | wc -l) || existing=0
          case "$existing" in
            ''|*[!0-9]*) existing=0 ;;
          esac
          if [ "$existing" -gt 0 ]; then
            echo "Failure comment already posted on #$PR_NUMBER; not posting again."
            exit 0
          fi

          if [ "$ANALYZE_RESULT" = "cancelled" ]; then
            reason="(cancelled)"
          else
            reason="${REASON:-unknown reason}"
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "$MARKER: ${reason}. This merge has no post-merge review until it is re-run." \
            || echo "::warning::could not comment on #$PR_NUMBER"
          exit 0

      # The only step in this workflow that writes findings to GitHub — see the
      # trust-boundary comment at the top of this file for why the model never
      # reaches this token. `scripts/review-outcomes.ts` reads what this step
      # writes back (buildShadowReviewIndex) to count skipped PRs that were
      # reviewed and the P1s among them — it matches this exact title shape and
      # the "- **P1**" / "- **P2**" bullet format below, so don't change either
      # without updating that script's SHADOW_REVIEW_TITLE_RE / P1_LINE_RE.
      - name: File findings, or confirm none were found
        if: needs.analyze.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          STRUCTURED_OUTPUT: ${{ needs.analyze.outputs.findings }}
        run: |
          set -euo pipefail

          # The runner drops any step output that contains a masked secret — never
          # replaces it with a placeholder, just an empty string
          # (actions/runner `JobExtension.cs:810-812`). So if the model echoed
          # analyze's own token into a finding's free text (the very prompt-
          # injection scenario the scrub below defends against), `findings`
          # arrives here as `''` even though `analyze` itself reported success.
          # An empty STRUCTURED_OUTPUT must never fall through to "no findings"
          # below: jq on empty input silently exits 0 with no output at all
          # (confirmed: `echo -n '' | jq '.x'` prints nothing, exit 0 — not an
          # error), so `findings_count` would end up empty, `[ "" -eq 0 ]` would
          # fail its own integer test (exit 2, not "true"), and execution would
          # fall into the FINDINGS branch with an empty `body` — filing a blank
          # issue and labeling the PR `shadow-reviewed`, turning a masked
          # credential exposure into "reviewed, clean". Fail closed instead, so
          # "Report a filing failure" below labels it `shadow-review-failed`.
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::findings output is empty (the runner drops outputs containing a masked secret — treat as a possible credential exposure)" >&2
            exit 1
          fi

          # Fail closed on a known token prefix anywhere in the model's output —
          # defense in depth (see the top-of-file comment: the job split, not
          # this scrub, is the primary control — analyze's token is read-only
          # and expires with that job, before this one even starts) against a
          # prompt injection in the diff that tries to exfiltrate or fabricate a
          # credential through a finding's free-text fields. Never post a
          # redacted body — a hit refuses the whole post.
          #
          # Deliberately NOT a generic "36+ mixed-case chars" heuristic: that
          # rule matched 203 real identifiers in this repo (e.g.
          # insertDeferredMessageWithContextIfNew,
          # loadRepositoryMigrationPrestageCache — both 36+ chars, mixed case),
          # so a finding that simply NAMES the function or variable it's about
          # would fail this step and the whole review would be lost. Prefixes
          # cover every credential in reach here, since that's all there is to
          # leak.
          PREFIX_RE='ghs_|ghp_|gho_|ghu_|ghr_|github_pat_|sk-ant-'
          if grep -qE "$PREFIX_RE" <<<"$STRUCTURED_OUTPUT"; then
            echo "::error::shadow review findings contain a token-shaped string; refusing to post" >&2
            exit 1
          fi

          # Label AFTER a post actually succeeds, never before: `gh pr comment` and
          # `gh issue create` below are unguarded, so if either fails, `-e` aborts
          # the step before its label-swap runs, and the "Report a filing failure"
          # step (below, `if: failure()`) applies shadow-review-failed instead — a
          # PR whose review never actually got posted must never read as reviewed.
          # The swap itself IS guarded: the review already posted by this point, so
          # a labeling hiccup afterward is a warning, not a reason to fail the step.
          findings_count=$(jq '.findings | length' <<<"$STRUCTURED_OUTPUT")
          # Defense in depth alongside the empty-output check above: `[ -eq ]`
          # below only ever compares against a true integer safely if
          # findings_count actually is one. A non-integer here (multiple
          # concatenated JSON values in STRUCTURED_OUTPUT producing one
          # `length` per value, e.g. "0\n1") would make `[ "$findings_count"
          # -eq 0 ]` itself fail its own integer test (exit 2, read as "false"
          # by `if`, not an error) and silently fall through to the FINDINGS
          # branch below with a garbled `body` — fail closed instead.
          case "$findings_count" in
            ''|*[!0-9]*)
              echo "::error::findings output has no usable finding count (got: '$findings_count')" >&2
              exit 1
              ;;
          esac
          if [ "$findings_count" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Shadow review (post-merge, advisory — docs/specs/risk-based-review/plan.md): no findings."
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label shadow-reviewed --remove-label shadow-review-failed \
              || echo "::warning::could not update labels on #$PR_NUMBER after a clean review"
            exit 0
          fi

          body=$(jq -r '
            "Post-merge advisory review of a PR that merged without review (docs/specs/risk-based-review/plan.md). This never blocked the merge — it is filed after the fact.\n\n"
            + ([.findings[]
                | "- **\(.severity)** — \(.file)" + (if .line then ":\(.line)" else "" end)
                  + " — " + (.class // "finding") + ": " + .description
               ] | join("\n"))
          ' <<<"$STRUCTURED_OUTPUT")

          # GitHub issue titles are capped at 256 characters; a long PR title plus the
          # "shadow review: #<n> " prefix can exceed it.
          full_title="shadow review: #$PR_NUMBER $PR_TITLE"
          if [ "${#full_title}" -gt 256 ]; then
            full_title="${full_title:0:253}..."
          fi

          gh issue create --repo "$REPO" \
            --title "$full_title" \
            --label shadow-review \
            --body "$body"
          gh pr edit "$PR_NUMBER" --repo "$REPO" \
            --add-label shadow-reviewed --remove-label shadow-review-failed \
            || echo "::warning::could not update labels on #$PR_NUMBER after filing findings"

      # analyze succeeded, but posting the result broke somewhere above — the scrub
      # refusing a token-shaped finding or an unreadable findings_count (both
      # `exit 1`), `gh pr comment` failing, or `gh issue create` failing.
      # Whatever happened, nothing was actually posted: label the PR failed
      # rather than let it read as reviewed (or, worse, as neither — see the
      # coverage-denominator caveat in `scripts/review-outcomes.ts`). `if: always()
      # && failure()`, matching the analyze-failed step's pattern above:
      # `failure()` already contains a status function so GitHub would not
      # auto-prepend `success()` to it either way, but spelling out `always()`
      # keeps both failure-catching steps in this job visually consistent. Never
      # itself fails the job further: every write is tolerated.
      #
      # The PR comment below is FIXED TEXT, not built from anything this step ran
      # alongside — never `$STRUCTURED_OUTPUT`, never the step summary text below,
      # never anything from "File findings"'s own log. The one path into this step
      # that matters most is the scrub refusing a token-shaped string: whatever
      # tripped it is still sitting in that step's log and in `$STRUCTURED_OUTPUT`
      # (this step's own env doesn't even receive it), and a comment built from
      # either would risk echoing the very credential the scrub existed to keep
      # off GitHub.
      #
      # Its own MARKER, distinct from "Report that analyze failed"'s: this step
      # ran (unlike that one, where analyze itself never produced a result), so
      # reusing that marker would be a wrong description AND a wrong duplicate
      # check — a PR that already carries an analyze-failure comment from an
      # earlier, unrelated run would match that marker's `startswith` test here
      # and this step would silently skip posting its own comment, even though
      # THIS run's failure (a filing failure, not an analyze failure) was never
      # reported at all.
      - name: Report a filing failure
        if: always() && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label shadow-review-failed \
            || echo "::warning::could not label #$PR_NUMBER shadow-review-failed"

          {
            echo "## Shadow review ran, but filing the result failed"
            echo ""
            echo "See the \"File findings, or confirm none were found\" step's own log above for why."
          } >> "$GITHUB_STEP_SUMMARY"

          # Idempotent across retries, same page-safe count pattern as "Report
          # that analyze failed" above (see that step for why `--jq` under
          # `--paginate` needs one id per line, not `| length`) — but its OWN
          # marker, per the comment above this step.
          MARKER="Shadow review ran but its result could not be posted"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null \
            | wc -l) || existing=0
          case "$existing" in
            ''|*[!0-9]*) existing=0 ;;
          esac
          if [ "$existing" -gt 0 ]; then
            echo "Filing-failure comment already posted on #$PR_NUMBER; not posting again."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "$MARKER. See the workflow run. This merge has no recorded post-merge review until it is re-run or labelled by hand." \
            || echo "::warning::could not comment on #$PR_NUMBER"
          exit 0
