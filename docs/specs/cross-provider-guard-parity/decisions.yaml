      LOW absolute-path over-block, documented intentional). Arc: (4) real-argv-token + per-segment;
      (5) whole-command + obfuscated-verb decoy + quoted-sep over-block; (6) reject unquoted backslash
      + IFS-split + newline metachar; (7) NUL-sentinel quote replacement (bash word-concatenation,
