name: CI

on:
  pull_request:
    branches: [main]

# Read-only token. These jobs run the PR's own code (install, tests), and this repo's
# default workflow token is write, so without this block any PR's tests could write to
# the repository as github-actions[bot], labels included. Every scope not listed here is
# none.
permissions:
  contents: read

# This repo is private on the GitHub Free plan: 2,000 Actions minutes/month, and
# running out kills every job account-wide until the 1st (happened 2026-08-31).
# The full suite costs ~20 min on GitHub's 2-vCPU runner and this repo merges
# ~25 PRs a day, which burned ~1,750 min/day in mid-September 2026 — parallelism
# and dropping `--coverage` were both measured and did not help (PR #873,
# vitest.config.ts). So this workflow, the pull_request lane, is typechecks, a
# few seconds-long tests and the hygiene report: correctness before merge is
# the author's job — run the tests for what you touched locally (CLAUDE.md,
# Development). The full suite lives in ci-full.yml (nightly + on demand) under
# its own workflow name; see that file for why the name matters to the merge
# gate.
#
# The workflow name stays `CI`: merge-check's required-workflow check
# (container/skills/pr-review-loop/scripts/codex-review.sh, `ci_verdict()`)
# reads the newest `CI` run on the exact head it was asked about, so a
# superseded push's run can be cancelled without confusing it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, as ci-full.yml's `correctness` job does
      # (.github/workflows/ci-full.yml:51-53) and for the same reason:
      # scripts/review-notes.test.ts (below) resolves every pinned `at <sha>`
      # citation (scripts/review-notes.test.ts:218-220) and, only when
      # `git rev-parse --is-shallow-repository` says true
      # (scripts/review-notes.test.ts:183-185), skips one it cannot resolve
      # with only a warning (scripts/review-notes.test.ts:232-237). Costs a
      # few seconds. run-host-ci.sh fetches full history for the same reason
      # (container/skills/pr-review-loop/scripts/run-host-ci.sh:165-175).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as `correctness` in ci-full.yml; keep the two together.
          bun-version: 1.3.14
      - name: Install host deps
        id: install
        run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        id: bun_install
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile
      # Each check reports even when an earlier one failed, so one run shows
      # the whole red list (#1067; the full rationale is above `Format check`
      # in ci-full.yml). .github/host-ci.sh mirrors only the `run:` lines and
      # stops at its first failure — it is a pass/fail stand-in, not a report.
      - name: Typecheck host
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc --noEmit
      - name: Typecheck scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc -p tsconfig.scripts.json --noEmit
      - name: Typecheck container
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.bun_install.outcome == 'success' }}
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit
      # The tests this lane runs, each seconds-long and service-free.
      # .github/host-ci.sh must stay
      # exactly this job's steps, and a drift found only by the nightly would
      # already have let a host-CI stand-in run less than CI does.
      - name: Host CI declaration mirrors this workflow
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run scripts/host-ci-declaration.test.ts --maxWorkers=1
      # docs/review-notes fragments are usually added in a PR's last commit;
      # with this check nightly-only, main went red twice on 2026-09-23 (#1089's
      # fragment, then a stale citation). ~60 tests, ~8s, git-only.
      - name: Review notes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run scripts/review-notes.test.ts --maxWorkers=1
      # src/upstream-ratchet.json must be regenerated whenever an upstream-owned
      # file changes (CLAUDE.md:105); a stale hash (#1103) otherwise first
      # shows at ci-full's drift tests. The suite is fs + crypto only, no git
      # (src/upstream-ratchet.test.ts:4-16), ~seconds. The GROWTH arithmetic
      # (ratchet:report) needs the pinned upstream commit and stays in
      # ci-full.yml's `bookkeeping` job (.github/workflows/ci-full.yml:320-334).
      - name: Upstream ratchet is current
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run src/upstream-ratchet.test.ts --maxWorkers=1
      # Dead code (knip, host and runner), duplication (jscpd) and prohibited
      # comment forms over the whole tree. `--report` prints the findings and
      # exits 0; enforcement drops the flag here, in host-ci.sh and in
      # ci-full.yml once main reports zero. A check that cannot run fails the
      # step in either mode.
      - name: Hygiene checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.bun_install.outcome == 'success' }}
        run: pnpm exec tsx scripts/hygiene/run.ts --report
      - name: Hygiene check fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run scripts/hygiene --maxWorkers=1
