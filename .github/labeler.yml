# Risk-based review scope — the single source of truth for which PRs get Codex review.
#
# A PR that changes ANY path below is labeled `risk:high` by
# .github/workflows/risk-label.yml, and only `risk:high` PRs are reviewed. Everything
# else merges on green CI. Rationale, audit data and rollback condition:
# docs/specs/risk-based-review/plan.md.
#
# Rule for adding a path: a mistake there is privileged, irreversible, or silently
# breaks every session — AND no deterministic gate already covers it. Upstream-owned
# files are deliberately absent: the upstream ratchet already gates them in CI.
#
# `risk:high` is the union of every path below and stays the only label the merge gate
# reads. Alongside it, each path also carries a `risk:<dimension>` label (guard,
# message-path, sweep, session-db, self-mod, credential, migration, supply-chain,
# deploy, gates, runner) so a reviewer can see which seam a PR touches without reading
# the whole diff; `scripts/labeler-config.test.ts` asserts the two stay in sync.
#
# Replayed against PRs #510–#595 on 2026-09-10 (measured before the dimension labels
# and the risk:runner/message-path/gates/supply-chain additions below): 18 of 60 (30%)
# would be reviewed.
# `sync-labels: true` removes a label when a later push stops touching its paths.
# To request review on a PR this file does not select, add `review:requested` by hand —
# never `risk:high`, which is machine-owned and would be removed on the next sync.

risk:high:
- changed-files:
  - any-glob-to-any-file:
    # Privileged-action decision seams (host + container) — named *guard* by convention
    - 'src/**/*guard*.ts'
    - 'container/agent-runner/src/**/*guard*.ts'
    - 'src/guard/**'
    # ...and the approval gates named otherwise: destructive/bash commands, held a2a messages
    - 'src/modules/bash-gate/**'
    - 'src/modules/agent-to-agent/message-gate.ts'
    - 'src/command-gate.ts'
    # The message path, both ends
    - 'src/router.ts'
    - 'src/delivery.ts'
    - 'container/agent-runner/src/admission-gate.ts'
    # Everything on a timer — the sweep plus the modules it was decomposed into
    - 'src/host-sweep.ts'
    - 'src/modules/sweep-scheduling/**'
    # Session DBs: the sole host<->container IO surface
    - 'src/modules/mailbox/**'
    - 'src/mailbox/sqlite/**'
    - 'container/agent-runner/src/mailbox/sqlite/**'
    - 'container/agent-runner/src/db/**'
    - 'container/agent-runner/src/poll-loop.ts'
    # Agents editing their own container config
    - 'src/modules/self-mod/**'
    # Credential, identity and privilege scoping (onecliSecrets, cli_scope, mounts) and
    # who may approve a privileged action (approval cards, click authorization, roles)
    - 'src/onecli-secrets.ts'
    - 'src/container-config.ts'
    - 'src/container-runner.ts'
    - 'src/cli/dispatch.ts'
    - 'src/cli/registry.ts'
    - 'src/modules/approvals/**'
    - 'src/modules/permissions/**'
    - 'src/modules/interactive/choice.ts'
    - 'src/modules/channel-config/**'
    - 'src/dashboard/auth/**'
    - 'src/dashboard/api/auth-me.ts'
    - 'src/dashboard/db/dashboard-tokens.ts'
    - 'src/dashboard/steer.ts'
    - 'src/dashboard/assign.ts'
    - 'src/dashboard/api/scheduled-shared.ts'
    # Irreversible against a live DB
    - 'src/db/migrations/**'
    # Supply chain: pnpm allowBuilds, and the container image it builds
    - 'pnpm-workspace.yaml'
    - 'container/Dockerfile'
    - 'container/build.sh'
    # Deploy and rollback (src/deploy-crash-guard.ts is covered by *guard*), and the
    # nightly host snapshot that scans for secrets then pushes config to a remote (and its
    # selfcheck), and the wiki autopush, which pushes to a remote with no scan at all
    - 'scripts/deploy.sh'
    - 'scripts/git-safety*.sh'
    - 'scripts/wiki-autopush.sh'
    # The gates themselves: CI workflows, this file, the git hooks, the public-boundary
    # checkers and allowlist, and the PR review loop that IS the review gate. CI runs
    # only the portable boundary mode, so the strict identifier check runs only in the
    # hooks and the daily remote scan.
    - '.github/**'
    - '.husky/**'
    - 'scripts/check-public-boundary.ts'
    - 'scripts/check-remote-boundary.ts'
    - '.public-boundary-allowlist.json'
    - 'container/skills/pr-review-loop/**'
    - 'docs/review-policy.md'
    # Executable agent and tool config: a hook (.claude/settings.json), an
    # auto-trusted MCP server (.mcp.json — any agent/CI tooling that honors
    # enableAllProjectMcpServers connects to it with no prompt), Claude Code's own
    # project trust/onboarding state (.claude.json), a ripgrep config (.ripgreprc —
    # the claude-code-action's own restore-config.ts:26-35 SENSITIVE_PATHS list
    # names it alongside these, i.e. Anthropic's own threat model treats it as
    # sensitive project config, not just prose), or a submodule URL (.gitmodules,
    # which a clone/checkout can fetch from). All five merge unreviewed today and
    # run (or load) the moment something checks the tree out and runs Claude
    # Code against it with default settings — including, in principle,
    # .github/workflows/shadow-review.yml's own reviewer, which DOES check the
    # tree out (required — see that file's top comment for why a no-checkout
    # design doesn't work against this action) but neutralizes them via
    # `--setting-sources user` and `--strict-mcp-config` in its `claude_args`.
    # CLAUDE.local.md is on that same SENSITIVE_PATHS list but deliberately NOT
    # here: .gitignore:29 (`**/CLAUDE.local.md`) means it can never appear in a
    # PR diff, so this rule would never fire. Plain CLAUDE.md is also NOT on
    # this list: it changes often enough that flagging every edit has a real
    # review cost, and shadow-review.yml's own reviewer already suppresses it via
    # `--setting-sources user` — see that file's top comment.
    - '.claude/**'
    - '.mcp.json'
    - '.claude.json'
    - '.ripgreprc'
    - '.gitmodules'
    # The agent-runner boot snapshot mounted read-only into every group, and its MCP
    # tool surface
    - 'src/agent-runner-source.ts'
    - 'src/group-init.ts'
    - 'container/agent-runner/src/mcp-tools/**'

