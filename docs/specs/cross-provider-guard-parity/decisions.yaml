      wrappers + value-of-option). DETECTION-evasion of a deliberately-obfuscated verb remains the
      documented egress-proxy boundary (out of scope, unchanged). Accepted fail-closed over-blocks
      locked as tests. Final: bootstrap guards 393/0, nanoclaw guard surface 77/0, both tsc clean,
      vendor --check + parity-lint green; 10 full-suite fails are the documented DB-race flakes.

waivers: []

assumptions:
  - id: A1
    stage: brief
    text: "email-gate boundary is the per-adapter gate primitive (D5), not an injected callback."
    validation: "Design confirms; build verifies Claude/Codex approval-card flow byte-for-byte preserved and OpenCode gets the same flow via its sync primitive."
    validated: false
    invalidated_at: null
  - id: A2
    stage: brief
    text: "sanitize-bash = command transform (provider-specific, out of verdict conformance) but its secret-stripping effect is a required parity outcome (C12). mnemon-real = portable verdict, migrate if cheap."
    validation: "Design records mechanism for the OpenCode env/secret outcome; mnemon-real migrated or explicitly deferred."
    validated: false
    invalidated_at: null
  - id: A3
    stage: brief
    text: "Claude-SDK disallowed-tool names map to real OpenCode tool names; the denylist is effective only for names that exist in OpenCode. MCP-prefixed (mcp__server__tool) variants are NOT covered by built-in names."
    validation: "Build enumerates OpenCode's actual tool names + audits MCP exposure."
    validated: false
    invalidated_at: null
  - id: A4
    stage: design
    text: "NANOCLAW_WORKGROUP_ID is readable in-container at agent-runner startup (set container-runner.ts:2136-2146; || null fallback for pre-036 schemas)."
    validation: "Grounded; build reads process.env.NANOCLAW_WORKGROUP_ID in git-worktrees.ts."
    validated: true
    invalidated_at: null
  - id: A5
    stage: design
    text: "Stripping auth env vars from the OpenCode child does not break OpenCode auth (it reads auth.json/XDG, not process.env — opencode.ts:52)."
    validation: "Grounded; build smoke-tests OpenCode auth after env-strip."
    validated: true
    invalidated_at: null
  - id: A6
    stage: design
    text: "[RESOLVED cycle-3 by D15] The denylist is NOT in the core. SDK_DISALLOWED_TOOLS is a static constant single-source in nanoclaw claude.ts:114-124, consumed sync by Claude's disallowedTools arg (claude.ts:1290) and re-exported same-repo by the codex runner (runner.ts:358). No dynamic load, no cross-repo copy — so the original 'feed the SDK arg from the async-loaded core' problem does not exist."
    validation: "Resolved at design (cycle 3). Build asserts: Claude passes SDK_DISALLOWED_TOOLS, Codex re-exports the same symbol, OpenCode consumes no denylist."
    validated: true
    invalidated_at: null

