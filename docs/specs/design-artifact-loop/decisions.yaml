    validators: [denoise, style, docs, code-review-CD, codex-E]
    must_fix_count: 8
    should_fix_count: 4
    resolution: "CD found 2 BUG (positional IDs; egress false-negatives); Codex E found ~6 MUST-FIX (path traversal id:'..'; symlink escape; token-trace reuse+non-hex; read-merge-write race; stale-critic-findings versioning; +egress/JS overlap). ALL fixed with regression tests. Deferred SHOULD-FIX: font shorthand, busy-wait, render-diagram flags, exotic-CSS color best-effort."
    completed_at: 2026-06-25
  - iteration: 2
    validators: [codex-E-reverify]
    must_fix_count: 4
    should_fix_count: 0
    resolution: "Codex re-review found 4 second-order evasions: run-dir symlink escape (#2), unquoted inline handler (#3), unquoted external src (#4), named/oklch colors (#5). ALL fixed + verified (tests encode the exact evasions; symlink probe confirms #2). Residual exotic-CSS color coverage classified as documented best-effort (vision critic + sandbox backstop; postcss parser = deferred dep-gated hardening) — NOT a blocker. design-review 63 tests pass; full suite 659 pass; typecheck clean."
    completed_at: 2026-06-25

auto_judgments:
  - stage: QA
    iteration: 2
    decision: "Stop the regex-linter evasion arms-race after cycle-2; classify exotic-CSS colour coverage as documented best-effort rather than chase every CSS syntax."
    grounding:
      - "container/agent-runner/src/mcp-tools/design-review/linter.ts — best-effort note + the L1 vision critic / sandboxed render / impeccable backstop (design D4)"
      - "team-qa anti-pattern: a finding-class reappearing across loops is a design issue (regex vs full parser) — real fix is postcss, which is dep-gated/deferred"
    scope_check:
      adds_user_facing_capability: false
      changes_external_behavior: false
      changes_hard_constraint: false
      weakens_safety_invariant: false
    recorded_at: 2026-06-25
