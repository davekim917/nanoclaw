feature: cross-provider-guard-parity
created_by: /team-brief
last_updated_by: /team-design

constraints:
  - id: C1
    type: HARD
    text: "Single-source policy: no adapter carries its own copy of a migrated guard's policy, except explicitly-marked fail-closed fallbacks used only when the core can't load."
    source: brief
    verified: false
    affects_groups: [A, B, E]
  - id: C2
    type: HARD
    text: "block-destructive-core.ts (workflow/) is source of truth; workflow-agents/ is vendored via scripts/vendor-guards.mjs (--check gate)."
    source: brief
    verified: false
    affects_groups: [D]
  - id: C3
    type: HARD
    text: "email-gate's existing human-approval flow for Claude/Codex is preserved exactly (no regression); the core stays I/O-free (env injected, gate primitive supplied by the adapter)."
    source: brief
    verified: false
    affects_groups: [A, E]
  - id: C4
    type: HARD
    text: "Fail-closed on security guards everywhere, INCLUDING when the guard plugin/core is absent."
    source: brief
    verified: false
    affects_groups: [B, E]
  - id: C5
    type: HARD
    text: "Spans nanoclaw-v2/container/agent-runner + davekim917/bootstrap. Bump bootstrap workflow plugin.json + marketplace.json and workflow-agents .codex-plugin/plugin.json per convention."
    source: brief
    verified: false
    affects_groups: [D]
  - id: C6
    type: HARD
    text: "codex exec sub-delegation fires no hooks — instruction-only on that path; no hook-parity claim."
    source: brief
    verified: false
    affects_groups: [H]
  - id: C7
    type: SOFT
    text: "Use core-conformance + per-adapter wiring/dispatch tests, not a cross-repo real-invocation harness."
    source: brief
    verified: false
    affects_groups: [C]
  - id: C8
    type: SOFT
    text: "Keep claude.ts edits minimal-risk (hot path); migrate guards incrementally with tests green at each step."
    source: brief
    verified: false
    affects_groups: []
  - id: C9
    type: HARD
    text: "The git-clone guard is ADVISORY (the agent already has RW to managed dirs). Airtight closure of bare-clone/git -C/renamed-binary/symlink bypasses is OUT OF SCOPE; comments/docs must say so."
    source: review (security + codex)
    verified: true
    affects_groups: [H]
  - id: C10
    type: HARD
    text: "OpenCode must fail CLOSED when the guard plugin is absent (today it keeps permission:'allow' + omits the plugin → unguarded). The brief's earlier 'fail-closed fallbacks' claim was wrong for OpenCode and is corrected."
    source: review (codex #3)
    verified: true
    affects_groups: []
  - id: C11
    type: HARD
    text: "New core FILES are not vendored unless added to VENDORED_FILES (vendor-guards.mjs:33). Either extend block-destructive-core.ts or add new files to that list + the --check."
    source: review (architecture S3)
    verified: true
    affects_groups: [D]
  - id: C12
    type: HARD
    text: "Env/secret parity: OpenCode shell tools must not see the auth env vars Claude/Codex strip via sanitize-bash (effect required; mechanism is design's choice)."
    source: review (codex #6)
    verified: true
    affects_groups: [F]

decisions:
  - id: D1
    stage: brief
    description: "Which claude.ts-inline guards migrate into the shared core."
    chosen: "All portable guards: self-approval, snowflake-connector, email-gate migrate to the core. sanitize-bash is a transform (out of verdict conformance, but its secret-stripping effect is required — see C12); mnemon-real migrates if cheap."
    rejected:
      - option: "Strict: migrate EVERY inline guard incl. sanitize-bash as a verdict."
        reason: "sanitize-bash mutates the command (transform), not a verdict — wrong shape for verdict conformance."
      - option: "Minimal: only the 3 gap guards, no disposition for sanitize/mnemon."
        reason: "Leaves claude.ts partly fat and masks the env/secret parity gap."
    constraint_refs: [C1, C8, C12]
    affects_groups: []
  - id: D2
    stage: brief
    description: "Strength of the conformance seam."
    chosen: "Core-conformance + per-adapter wiring tests + per-adapter DISPATCH-COVERAGE tests + a guard-absence-fails-closed assertion."
    rejected:
      - option: "Real per-adapter invocation harness (cross-repo)."
        reason: "Higher wiring cost; user chose the existing pattern. Dispatch-coverage closes the 'reached' gap without a cross-repo harness."
      - option: "Core-conformance + wiring tests only (original brief)."
        reason: "Reviews showed wiring tests prove 'correct' not 'reached' — the exact drift that caused OpenCode's blindness. Dispatch-coverage added."
    constraint_refs: [C7]
    affects_groups: []
  - id: D3
    stage: brief
    description: "Where clone_repo lands repos."
    chosen: "/workspace/workgroup/repos/<name> (shared, per workgroup-shared-fs spec), fallback to /workspace/agent/repos/<name> when no workgroup mounted; keep resolving legacy /workspace/agent/<name>. Includes path-allowlist repoints."
    rejected:
      - option: "Keep /workspace/agent/repos (private)."
        reason: "Contradicts the spec's shared-repo intent + the 'one team' model; siblings would re-clone separately."
    constraint_refs: []
    affects_groups: []
  - id: D4
    stage: brief
    description: "Handling the shipped steps 1-3 given the reviews."
    chosen: "Apply the safe correctness fixes immediately (gate-type narrow, +workgroup, fail-closed, honest comments, CLAUDE.md wording — shipped in bootstrap d23df80 + nanoclaw f7fa1740) and fold the deeper redesign (clone destination, OpenCode fail-open, email-gate, tool-denylist, env/secret, dispatch tests) into this feature."
    rejected:
      - option: "Leave steps 1-3 untouched; fold everything into the feature."
        reason: "The safe fixes are unambiguous improvements with no design dependency — no reason to defer."
    constraint_refs: [C9, C10]
    affects_groups: []
  - id: D5
    stage: brief
    description: "email-gate cross-adapter boundary."
    chosen: "Pure evaluateEmailSend(command, env-snapshot) + each adapter reuses the gate primitive it already owns (Claude/Codex async awaitDeliveryAck — untouched; OpenCode sync runNanoclawGate/writeGateRequest+pollDeliveredTable). NOT a bespoke injected-callback port."
    rejected:
      - option: "Injected I/O callback interface (original brief A1)."
        reason: "OpenCode's adapter is a sync throw; it can't await. The destructive gate already solved this with the sync primitive — reuse it. Strictly less new surface."
    constraint_refs: [C3]
    affects_groups: []
  - id: D6
    stage: brief
    description: "tool-denylist parity placement."
    chosen: "Treat as its own design item (a flat string list, not a verdict — no core/conformance home). Must map Claude-SDK tool names to OpenCode names and run around OpenCode's permission auto-reply 'always' path, not only tool.execute.before."
    rejected:
      - option: "Fold into the conformance contract (original brief)."
        reason: "Structurally can't — it's not a verdict evaluator."
    constraint_refs: [C4]
    affects_groups: []
  - id: D7
    stage: design
    description: "email-gate cross-provider shape (D-A)."
    chosen: "Pure evaluateEmailSend(command, envSnapshot)->{action:'allow'|'gate', label?, summary?} in a NEW vendored email-gate-core.ts; verdict is shared/conformance-pinned, approval round-trip stays per-adapter (Claude/Codex async awaitDeliveryAck untouched; OpenCode sync writeGateRequest+pollDeliveredTable)."
    rejected:
      - { option: "Inline-only in nanoclaw", reason: "OpenCode can't reach it." }
      - { option: "Extract envelope parsing only", reason: "doesn't solve parity." }
    constraint_refs: [C1, C3]
    affects_groups: []
  - id: D8
    stage: design
    description: "Approval gate primitive (D-B)."
    chosen: "Dual path is load-bearing: OpenCode sync runNanoclawGate; Claude/Codex async awaitDeliveryAck. OpenCode tool.execute.before is a sync throw + OC 1.15.7 has no async hooks."
    rejected:
      - { option: "Unified async + OpenCode sync-wrapper", reason: "couples to Bun Atomics, no win." }
      - { option: "Async everywhere", reason: "OpenCode contract can't support it today." }
    constraint_refs: [C3]
    affects_groups: []
  - id: D9
    stage: design
    description: "self-approval + snowflake migration + sanitize-bash disposition (D-C)."
    chosen: "Extract evaluateSelfApproval + evaluateSnowflakeConnector into block-destructive-core.ts (extend, no VENDORED_FILES change); claude.ts thin verdict->denyBash + fallback; codex inherits; opencode-guard calls them. sanitize-bash stays a TRANSFORM (provider-specific); its secret-stripping effect reaches OpenCode via D-E env-scrub."
    rejected:
      - { option: "Migrate sanitize-bash as a verdict", reason: "it mutates the command (updatedInput), not a verdict." }
    constraint_refs: [C1, C12]
    affects_groups: []
  - id: D10
    stage: design
    description: "OpenCode tool-denylist enforcement (D-D)."
    superseded_by: D15
    chosen: "[SUPERSEDED cycle-3 by D15] tool-name check in opencode-guard tool.execute.before before file-protection; canonical DISALLOWED_TOOLS as a vendored constant in block-destructive-core.ts, shared by opencode/codex + Claude's SDK arg/hook."
    rejected:
      - { option: "Permission-event check before the 'always' auto-reply", reason: "depends on the OC SDK exposing tool_name (unverified in 1.15.7)." }
      - { option: "MCP config-time filtering", reason: "misses built-in tools." }
    constraint_refs: [C4]
    affects_groups: []
  - id: D11
    stage: design
    description: "OpenCode fail-closed + env parity (D-E)."
    chosen: "Refuse spawn (throw in buildOpenCodeConfig) if guard plugin absent; strip auth env vars from the OpenCode child env before spawn (safe — OC auths via auth.json/XDG). Optional additive OPENCODE_ALLOW_UNGUARDED=1 dev opt-out, default-closed."
    rejected:
      - { option: "Deny-by-default permission", reason: "useless session + needs SDK support." }
    constraint_refs: [C4, C12]
    affects_groups: []
  - id: D12
    stage: design
    description: "Clone destination move (D-F)."
    chosen: "Runtime getReposDir() via NANOCLAW_WORKGROUP_ID + fs.existsSync('/workspace/workgroup') -> workgroup/repos else agent/repos; resolveRepoDir precedence workgroup/repos->agent/repos->legacy; clone_repo verifies origin==URL + only rmSync a no-.git empty dir; add /workspace/workgroup to core.ts + poll-loop allowlists; WORKTREES_DIR unchanged."
    rejected:
      - { option: "clone-to-agent + resolveRepoDir-reads-workgroup", reason: "doesn't actually share on clone (violates spec intent)." }
    constraint_refs: []
    affects_groups: []
  - id: D13
    stage: design
    description: "Conformance seam (D-G)."
    chosen: "conformance.test.ts (verdicts) + per-adapter dispatch-coverage tests co-located with each adapter (drive the REAL entrypoint: OpenCode NanoclawGuard tool.execute.before, Codex runHookForCodex, Claude PreToolUse chain) + guard-absence-fails-closed assertions."
    rejected:
      - { option: "New vendored block-destructive-dispatch.ts wrapper + vendored .test.ts (grounding Approach B)", reason: "over-engineered; vendoring test files non-standard; cross-adapter test can't import 3 adapters across repo boundaries in isolated caches." }
    constraint_refs: [C7]
    affects_groups: []
  - id: D14
    stage: design
    description: "Shared-core layout + vendor (D-H, resolves C11)."
    chosen: "Extend block-destructive-core.ts for the two small additions (self-approval, snowflake) — no VENDORED_FILES change; add ONE new email-gate-core.ts -> add to VENDORED_FILES + --check. Re-vendor + bump plugin versions. [REVISED cycle-3: DISALLOWED_TOOLS is NOT added to the core — per D15 it stays single-source in nanoclaw claude.ts, never vendored.]"
    rejected:
      - { option: "All-new-files for every guard", reason: "needless file + vendor churn for tiny regex guards." }
    constraint_refs: [C2, C11]
    affects_groups: []

  - id: D15
    stage: review
    description: "Denylist single-source placement (cycle-3, supersedes D10 + D14's DISALLOWED_TOOLS clause + A6)."
    chosen: "SDK_DISALLOWED_TOOLS stays SINGLE-SOURCE in nanoclaw claude.ts:114-124 (a static constant). Claude consumes it via the sync disallowedTools SDK arg (claude.ts:1290) + preToolUseHook; Codex via the same-repo re-export (runner.ts:358). It is NOT added to block-destructive-core.ts and NOT vendored. OpenCode adds NO runtime denylist check (the 9 CamelCase Claude-builtin names cannot occur on OpenCode's lowercase tool surface — verified no-op). OpenCode parity is a RECURRING build-time enumeration test that classifies every exposed tool (built-ins + mcp__) against a minimal capability map and FAILS on any denied-capability match OR unrecognized tool."
    rejected:
      - { option: "cross-repo copy of the denylist + byte-equal parity test (cycle-2 M2)", reason: "unimplementable AND unnecessary — the two repos are isolated Bun trees, vendor-guards reaches one way only, and the symbol need not exist in bootstrap (A-Finding-1)." }
      - { option: "vendor DISALLOWED_TOOLS into block-destructive-core.ts (D10/D14)", reason: "needless vendor surface for a constant only Claude/Codex (same repo) consume; OpenCode consumes no denylist." }
      - { option: "runtime denylist name-check in opencode-guard.ts as defense-in-depth", reason: "pure no-op for the current OpenCode tool surface; add an explicit block only if a future enumeration finds a real OpenCode equivalent (codex C3-2 — no production OpenCode denylist to dispatch-test)." }
    constraint_refs: [C1, C4, C7]
    affects_groups: [F, C]
  - id: D16
    stage: review
    description: "writeGateRequest action parameterization (cycle-3, refines D7/D-A)."
    chosen: "[REVISED cycle-5 by D18 for signature-safety] Add an `action` param to the INTERNAL writeGateRequest (called only by gate wrappers) + a new action-aware lower-level runGateRequest(command, reason, {action, onStageError}). Keep the existing runNanoclawGate(command, reason, onStageError?) signature UNCHANGED as the destructive wrapper (request_destructive_gate); runEmailGate(command, reason, onStageError?) is the bash-gate wrapper (request_bash_gate). OpenCode's email gate calls runEmailGate (emits request_bash_gate, matching Claude/Codex's card type), NOT the destructive writer which hardcodes request_destructive_gate (block-destructive-core.ts:963 SoT). Claude/Codex async awaitDeliveryAck path untouched. A dispatch test asserts email->request_bash_gate, destructive->request_destructive_gate per adapter; a regression test asserts the legacy 3-arg runNanoclawGate(cmd,reason,cb) still emits request_destructive_gate."
    rejected:
      - { option: "OpenCode email reuses writeGateRequest as-is", reason: "it hardcodes action:'request_destructive_gate' -> host renders the wrong card ('🛑 Destructive command' vs '⚠️ Bash command', src/modules/bash-gate/index.ts:293-310), silently degrading OpenCode's email approval vs Claude's (C3-1 / A-Finding-2, verified core.ts:963)." }
    constraint_refs: [C1, C3]
    affects_groups: []

  - id: D17
    stage: review
    description: "Codex fail-closed completeness (cycle-4 M1, extends D-E/D11)."
    chosen: "D-E's Codex fail-closed flip covers BOTH dynamically-loaded container-side cores: loadGuardCore/runDestructiveGuard (runner.ts:106-116/138-139) AND loadFileProtectionCore/runFileProtection (runner.ts:178-186/195-196) — both fail OPEN today. Flip both to deny-on-absent. Also handle 'invalid' (not just 'missing'): each loader validates required-export types (typed-failure -> deny) and runDestructiveGuard/runFileProtection map any evaluator exception to a deny decision. The fail-closed export-validation (both adapters) covers the gate primitives (writeGateRequest action union, runEmailGate, runNanoclawGate, pollDeliveredTable), not just verdict evaluators. Tests: missing / malformed / throwing per core. Does NOT touch the four claude.ts hook factories the codex chain imports (runner.ts:244-250) — same-repo, cannot be absent."
    rejected:
      - { option: "flip only loadGuardCore (D-E as-written through cycle 3)", reason: "leaves loadFileProtectionCore fail-open -> residual HARD C4 violation: a missing Codex mount would silently allow .env/lockfile/.git edits; contradicts the design's own 'uniform fail-closed' (D-G) claim (A-Finding-1 cycle-4)." }
      - { option: "treat import-success as trusted (handle 'missing' only)", reason: "a malformed-but-importable core passes await import() then throws at call time outside a deny path -> 'invalid core' is not actually fail-closed (codex-C3)." }
    constraint_refs: [C4]
    affects_groups: [E]

  - id: D18
    stage: review
    description: "Signature-safe gate-wrapper refactor (cycle-5 codex-C5-1, supersedes D16's positional-action approach)."
    chosen: "Preserve the existing runNanoclawGate(command, reason, onStageError?) signature. Add `action` to the internal writeGateRequest (only the wrappers call it). Add a lower-level runGateRequest(command, reason, {action, onStageError}); runNanoclawGate is the destructive wrapper (request_destructive_gate, signature unchanged), runEmailGate is the bash-gate wrapper (request_bash_gate). Regression test: legacy 3-arg runNanoclawGate(cmd, reason, cb) still emits request_destructive_gate (zero caller churn)."
    rejected:
      - { option: "runNanoclawGate(command, reason, action='request_destructive_gate', onStageError?) (D16/cycle-4 as-written)", reason: "inserts `action` at positional arg 3 where existing callers pass the onStageError CALLBACK (runner.ts:153 `runNanoclawGate(command, reason, () => {...})`, opencode-guard.ts:78, Claude block-destructive) -> shifts the callback, regresses the destructive gate. The 'back-compat' claim was false (codex-C5-1, verified runner.ts:153). TS would flag it at every call site, but the design must not ship a misleading signature." }
    constraint_refs: [C1, C3]
    affects_groups: [A, E]

