decisions:
  - id: D1
    stage: design
    description: 'Canonical memory and compatibility'
    chosen: >-
      Canon is data/workgroups/<workgroup-id>/memory, mounted at
      /workspace/workgroup/memory; every sibling keeps /workspace/agent/memory
      through the current compatibility-link pattern. Startup/group-init/spawn
      reconcile only missing paths and exact shipped scaffolds. Any substantive
      or ambiguous local tree fails closed to the quiescent lossless migrator;
      only its verified cutover imports bytes and installs the link. Host tools
      use canonical host paths, never the container-only link.
    rejected:
      - { option: 'Independent group copies', reason: 'Copies diverge and violate one canon.' }
      - {
          option: 'Host-only coordinator and projections',
          reason: 'Breaks direct Markdown editing and adds another authority.',
        }
    constraint_refs: [C1, C2, C3, C7, C8]
    affects_groups: [A, D]

  - id: D2
    stage: design
    description: 'Automatic provider context'
    chosen: >-
      At writeSessionMessageInternal, pass normalized row/content as untrusted
      query input, derive scope from trusted DB state, apply the host equivalent
      of isAdmissibleTrigger, and transactionally insert the paired row first.
      Serialize untrusted excerpts collision-safely apart from trusted
      capabilities; bound/fail-open each source with degraded notices. Only
      trusted scope-resolution failure blocks ingress. Runner prompt limits
      select pair-complete recall/trigger logical units.
    rejected:
      - { option: 'Require provider tools', reason: 'Optional discovery caused the observed failures.' }
      - {
          option: 'New runtime schema and admission protocol',
          reason: 'The paired row already provides ordered transport.',
        }
    constraint_refs: [C4, C5, C8, C9]
    affects_groups: [B, C]

  - id: D3
    stage: design
    description: 'Recall sources'
    chosen: >-
      Search canonical Markdown and current host archive directly, preferring
      current thread and exact pasted links. First spike the lexical corpus;
      permit only bounded ephemeral current-query expansion if needed, then stop
      if unchanged gates still fail. Graphify stays optional/advisory.
    rejected:
      - {
          option: 'Graphify correctness floor',
          reason: 'It missed production SipTrue evidence retained in the archive.',
        }
      - { option: 'Archive as distilled canon', reason: 'Archive is exact provenance; Markdown is distilled memory.' }
    constraint_refs: [C2, C3, C5, C8, C9]
    affects_groups: [B, D]

  - id: D4
    stage: design
    description: 'Durable capture'
    chosen: 'Archive exact history and preserve direct agent-curated shared Markdown; add no semantic classifier or fact store.'
    rejected:
      - { option: 'Classify every turn into facts', reason: 'Duplicates provenance and creates another authority.' }
    constraint_refs: [C1, C2, C5, C7, C8]
    affects_groups: [B, D]

  - id: D5
    stage: design
    description: 'Write concurrency'
    chosen: >-
      One provider-neutral command holds a bounded nonblocking kernel flock on
      one host-created, no-follow regular sidecar shared by every workgroup
      sibling. The lock covers expected-hash validation, temp write/fsync,
      recheck, descriptor-anchored rename, and parent fsync; process death
      releases it without PID/time stealing. New notes use unique names. Raw
      shell edit remains an explicit ordinary-filesystem escape hatch.
    rejected:
      - { option: 'Distributed writer/ledger', reason: 'No demonstrated workload justifies breaking direct edits.' }
    constraint_refs: [C1, C2, C7, C8]
    affects_groups: [C]

  - id: D6
    stage: design
    description: 'Migration and rollback'
    chosen: >-
      Discover all sources at execution time, snapshot and checksum every byte,
      ignore only exact scaffold, copy without overwrite, preserve collisions
      under imports/<source-group>/, and verify report/rollback. Before snapshot
      and again before cutover, clean install-scoped orphans and prove no affected
      container remains; rehash immediately before switching links.
    rejected:
      - {
          option: 'Hard-code stores or choose one winner',
          reason: 'Live inputs change and winner selection loses customizations.',
        }
      - { option: 'Semantic conflict merge', reason: 'Equivalence cannot be proven.' }
    constraint_refs: [C1, C2, C6, C7]
    affects_groups: [A, D]

  - id: D7
    stage: design
    description: 'Security boundary'
    chosen: >-
      Derive workgroup and session messaging context from trusted host DB state;
      reuse workgroup pooling and owner-safe capability filtering without new
      intra-workgroup audience algebra.
    rejected:
      - { option: 'Model-provided scope', reason: 'Untrusted identifiers cannot authorize access.' }
      - { option: 'New audience/isolation systems', reason: 'Outside the approved boundary and regression.' }
    constraint_refs: [C3, C4, C5, C8]
    affects_groups: [B, D]

