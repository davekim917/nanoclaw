name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with ARG BUN_VERSION in container/Dockerfile. This pin
          # last moved in April; the image went to 1.3.14 in May, so CI spent two
          # months testing agent-runner code against a Bun we never ship.
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Public repository boundary
        run: pnpm run check:public-boundary -- --portable

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Host tests
        run: pnpm exec vitest run --maxWorkers=2

      - name: Container tests
        if: ${{ !cancelled() }}
        working-directory: container/agent-runner
        # Keep Bun's native runner. This step still runs after a host-test
        # failure so a red host baseline cannot hide the container signal.
        run: bun test

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: test
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
