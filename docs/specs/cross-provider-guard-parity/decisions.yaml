    should_fix_count: 2
    completed_at: 2026-06-19
    note: "Validators: denoise (clean), swarm (adversarial/security/domain on nanoclaw), codex E cross-model (both repos). 1 MUST-FIX (M-QA1 Codex guard fail-open) FIXED + regression-tested; 1 HIGH pre-existing escalated (codex #2 email --dry-run-in-content bypass, faithfully ported per C3); 2 SHOULD-FIX listed for ship. MUST-FIX==0 after fix -> Stage E."
  - iteration: "2-9 (email-bypass re-pass)"
    must_fix_count: 0
    should_fix_count: 2
    completed_at: 2026-06-19
    note: >
      QA RE-PASS triggered by explicit user instruction ("do a qa repass and fix the email bypass").
      This SUPERSEDES C3 (preserve email-gate flow EXACTLY) for the bypass-detection path: the user
      directed the fix, so codex #2 moves from ESCALATED to FIXED. Iterative cross-model loop
      (codex exec -s read-only): cycles 4-8 each surfaced a real, source-verified bypass of a DETECTED
      send and were fixed fail-closed in SoT (email-gate-core.ts) + mirrored in the inline fallback
