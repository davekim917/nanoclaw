# Flags a commit that reached main without going through a merged PR.
#
# The pre-push hook refuses direct pushes to main, but only on this host's checkout:
# container pushes run no hook (scripts/pin-git-hooks-path.sh), and GitHub offers no
# branch protection on a private Free-plan repo. This is detection, not prevention: a
# red run on main, which GitHub reports to whoever pushed.
#
# Two jobs, two different sources of truth for the same rule — main only moves through
# a merged PR:
# - `provenance` runs on every push to main and checks only the tip that push just
#   landed, via .github/scripts/check-provenance-commit.sh (test-merge format,
#   GitHub-made, PR-linked — see that script for what each proves).
# - `sweep` runs daily (plus on-demand) and checks GitHub's repository Activity API
#   over the last 50 hours of main (floored at a one-time policy-start date so it never
#   re-flags known history predating this check — see that script), via
#   .github/scripts/sweep-main-activity.sh. It does NOT walk `git log --since`: that
#   filters on committer date, a value the pusher controls, so a backdated commit
#   carrying a skip-CI commit-message marker would hide itself — and everything earlier
#   in the window — from a history walk. `sweep` exists to catch exactly what a
#   push-triggered job never runs for: a skip-CI push, or one that landed during a
#   GitHub Actions outage.
# A third job, `gate-audit`, runs on the same pushes and asks a different question: not
# whether main moved through a merged PR, but whether that PR had the evidence the merge
# gate requires, judged as of its merge (codex-review.sh audit, via
# .github/scripts/gate-audit.sh). It writes one thing, a `gate-bypass` issue per flagged
# PR, and blocks nothing. A fourth, `gate-audit-sweep`, is its daily backstop, beside
# `sweep`: every PR merge on main in the last 50 hours whose push-triggered audit left no
# result (the run was skipped, dropped or failed) is audited then, through the same filing.
# None of the four runs PR code. `provenance` and `gate-audit` check out only the commit
# their push already landed. `sweep` checks out whatever ref triggered it — main on the
# daily schedule, or another ref if `workflow_dispatch` is run from one — for its own
# script, which only reads. `gate-audit-sweep`, which writes issues, runs only main's
# copy of its script: its `if:` skips a dispatch from any other ref, and its checkout
# names `main`, so dispatching an unmerged branch never runs that branch's gate-audit.sh
# with `issues: write`. (A branch that also edits this workflow file is dispatched with
# its own job definition; no condition in main's copy reaches that.) Both query history
# through the Activity API, not `git log`; `gate-audit-sweep` then runs each merge
# commit's own audit code, extracted from that commit with `git archive`.
# A force-push fails `provenance` outright, since it can rewind main onto an old merge
# commit; `sweep`'s Activity API window covers force-pushes too (`force_push` is one of
# the activity types it treats as an offender).
#
# GitHub does not sign rebase-merge commits (GitHub docs, "Signature verification for
# rebase and merge": "GitHub didn't truly create this commit, and can't therefore sign
# it"). Rebase merging is still enabled in this repo's settings and has been used once —
# PR #74, merged 2026-05-01, merge_commit_sha b2b3b90ee0, which has a single parent, is
# unsigned, and is committed by the user account rather than `web-flow`. That fails
# `provenance`'s GitHub-made check in check-provenance-commit.sh — intended, not a bug
# to route around. It does NOT fail `sweep`: the Activity API records a rebase merge as
# `pr_merge` (confirmed live for #74), the same as any other GitHub-performed merge, so
# `sweep` correctly treats it as a genuine PR merge — this repo's two checks disagree on
# purpose, one checking provenance (came from a PR) and the other checking signature
# (GitHub made the commit). Disabling rebase merging is the operator's call, not this
# workflow's; an earlier attempt to do so was blocked.
name: Main provenance

on:
  push:
    branches: [main]
  schedule:
    # 08:17 UTC daily — clear of the hour/half-hour marks where scheduled-workflow
    # load (and GitHub's "may be delayed" best-effort scheduling) concentrates.
    - cron: '17 8 * * *'
  workflow_dispatch: {}

# The default GITHUB_TOKEN for this repo is still `write`, not read-only, so every job
# below declares its own minimal `permissions:` rather than relying on a workflow-level
# default. `provenance` and `sweep` only ever read; `gate-audit` and `gate-audit-sweep`
# also write issues.
permissions: {}

jobs:
  provenance:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The new main came from a merged PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$FORCED" = true ]; then
            echo "::error::main was force-pushed to $SHA; changes reach main only through a PR merge"
            exit 1
          fi
          .github/scripts/check-provenance-commit.sh "$SHA"

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Contents read only: sweep-main-activity.sh calls only the Activity API, which
    # GitHub's permissions-required-for-github-apps reference lists under Contents —
    # unlike `provenance`, it never calls the PR-link endpoint, so no pull-requests
    # permission here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Every activity on main in the last 50 hours came from a merged PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/sweep-main-activity.sh 50

  gate-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One audit per pushed commit at a time, so a re-run waits for the run before it and
    # the two can't both file the same PR's issue before either sees the other's. Keyed
    # on the commit: a group keeps only one pending run and cancels it for the next
    # (docs.github.com/en/actions/concepts/workflows-and-actions/concurrency), so one
    # group shared by every push would drop the audit of a push that queued behind
    # another. Two commits never audit the same PR (gate-audit.sh audits only the PRs
    # whose merge commit is the one pushed).
    concurrency:
      group: gate-audit-${{ github.sha }}
      cancel-in-progress: false
    # What merge-check reads, read-only (labeler.yml and the comparison, the PR and its
    # comments, Actions runs, commit statuses), plus the one thing this job writes: a
    # `gate-bypass` issue and its label.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The merged PR had the evidence the merge gate requires
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: .github/scripts/gate-audit.sh "$SHA"

  gate-audit-sweep:
    # Main's copy of gate-audit.sh only, never an unmerged branch's (see the header).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # One sweep at a time, so a scheduled and a dispatched sweep can't both file the
    # same PR's issue; gate-audit.sh also closes a duplicate that gets through.
    concurrency:
      group: gate-audit-sweep
      cancel-in-progress: false
    # A job of its own rather than a step in `sweep`, so `sweep` keeps its read-only
    # token and each fails on its own. The same permissions as `gate-audit`.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: read
      issues: write
    steps:
      # Full history: each merge is audited by the audit code its own merge commit
      # carries, extracted with `git archive`.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Every PR merge in the last 50 hours had its gate audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/gate-audit.sh --sweep 50
