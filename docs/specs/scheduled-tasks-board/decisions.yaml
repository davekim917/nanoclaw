feature: scheduled-tasks-board
created_by: /team-brief
last_updated_by: /team-design

constraints:
  - id: C1
    type: HARD
    text: "Scheduled work remains in per-session inbound.db messages_in rows (recurring = recurrence set; one-offs = future process_after, recurrence NULL); board manages in place via host APIs. No changes to the firing mechanism or the status values it reads."
    source: brief
    verified: true
    affects_groups: []
  - id: C2
    type: HARD
    text: "Move = cancel-in-source + scheduleTask()-into-target, two host ops sequenced by the board API. scheduleTask provides fail-closed wiring validation on the insert only; series identity across a move is nominal (shared series_id string, two DBs); pre-move history stays in the source session; post-move invariant: exactly one live row fleet-wide per series."
    source: brief
    verified: true
    affects_groups: []
  - id: C3
    type: HARD
    text: "Host process is the only writer of session inbound DBs — all board mutations execute in the host process (dashboard API routes)."
    source: CLAUDE.md
    verified: true
    affects_groups: []
  - id: C4
    type: HARD
    text: "Reuse the existing BoardShell dashboard frame, auth, and API router — Scheduled is a third view. Every mutation handler adds its own per-handler authorization gate (canSteer precedent); requireAuth's read filter alone does not authorize mutation."
    source: brief
    verified: true
    affects_groups: []
  - id: C7
    type: HARD
    text: "Scheduled read API applies the existing per-group dashboard scope filter (disclose-as-not-found). Fleet-wide = all groups the caller is authorized for, not a scope bypass."
    source: brief
    verified: true
    affects_groups: []
  - id: C5
    type: SOFT
    text: "Current-state read follows scripts/list-scheduled-tasks.ts shape (latest-row-per-series + central join), extended to one-offs; fire history is an additional deliberately-widened capped query (e.g. last 5 fires)."
    source: brief
    verified: true
    affects_groups: []
  - id: C6
    type: SOFT
    text: "Display both UTC and service-local (systemd unit TZ) next-fire times."
    source: brief
    verified: true
    affects_groups: []
  - id: C8
    type: SOFT
    text: "Cron edits validate via the firing path's parser and fail closed; prompt/script edits enforce a length bound (steer's 4000-char precedent as reference)."
    source: brief
    verified: false
    affects_groups: []

decisions:
  - id: D1
    stage: brief
    description: "Data model for the board: manage in place vs migrate to a central table first"
    chosen: "Manage in place (v1). Board wraps existing primitives (scheduleTask, updateTask, pauseTask/resumeTask, cancelTask); central-table migration recorded as explicit non-goal / future brief."
    rejected:
      - option: "Migrate scheduled tasks to a central scheduled_tasks table first, build the board on it"
        reason: "User deferred the call; agreed instinct that session-level storage is a wart, but rearchitecting the firing path is low-value churn for this feature's goals. Revisit as its own feature if the wart still bites post-board."
    constraint_refs: [C1]
    affects_groups: []
  - id: D2
    stage: brief
    description: "Treatment of module-owned tasks (memory-synth/lint, mnemon, support poller)"
    chosen: "Visible, badged with owning module, editable — every edit gated by a confirm whose copy accurately states the real risk: edits persist until the module's enable/bootstrap script is re-run, which silently overwrites them (verified: bootstrap is NOT called on host start; only enable scripts / create_agent)."
    rejected:
      - option: "View-only badge (pause/run-now allowed, edits blocked)"
        reason: "User chose full editability; one code path, full operator control."
      - option: "Hide module-owned tasks"
        reason: "Defeats the 'see everything' goal."
    constraint_refs: []
    affects_groups: []
  - id: D3
    stage: brief
    description: "v1 management verb set beyond edit-prompt/script/cron and move-agent/channel"
    chosen: "Pause/resume (existing status='paused' primitives; resume recomputes next cron slot — skip, don't replay), run-now (process_after=now on the pending row; no-op with message if due/processing), delete/cancel (must remain distinguishable from natural completion in history)."
    rejected:
      - option: "Create new task from the board"
        reason: "User did not select it; tasks continue to be created via chat (schedule_task MCP). Keeps v1 smaller."
      - option: "Resume replays a missed fire immediately (catch-up)"
        reason: "Surprising ('resumed at 3pm, the 9am briefing fired instantly'); inconsistent with the scheduler's skip-missed-slots semantics (recurrence.ts nextRun)."
    constraint_refs: [C1]
    affects_groups: []
  - id: D4
    stage: brief
    description: "Include one-off future-dated (non-recurring) scheduled messages on the board"
    chosen: "Yes — shown alongside recurring series, cancellable. C1/C5 worded to cover recurrence-NULL rows explicitly (review caught the original wording making D4 impossible)."
    rejected:
      - option: "Recurring series only"
        reason: "One-offs are also scheduled work the operator can lose track of."
    constraint_refs: [C1, C5]
    affects_groups: []
  - id: D5
    stage: brief
    description: "Project scope file staleness (package.json newer than docs/project-scope.md)"
    chosen: "Proceed with existing scope file — domain signals unchanged; intervening package.json changes were dependency bumps."
    rejected:
      - option: "Re-run discovery and regenerate project-scope.md"
        reason: "No domain-level change to capture."
    constraint_refs: []
    affects_groups: []
  - id: D6
    stage: brief
    description: "Health/dead-series detection semantics (4-reviewer pass, unanimous MUST-FIX)"
    chosen: "Derived overdue check (live pending row's process_after past by > one expected interval), never row status alone — the May/June 2026 die-offs left no failed row. Fire-history states enumerated; unhealthy-first default sort; stranding test added to success criteria."
    rejected:
      - option: "Flag series whose last row has status='failed'"
        reason: "The headline failure mode never produces a failed row; the board would have shown all 17 poisoned series as healthy."
    constraint_refs: [C5]
    affects_groups: []
  - id: D7
    stage: brief
    description: "Mutation authorization tier (security review MUST-FIX)"
    chosen: "v1: all Scheduled-board mutations require owner or global-admin (per-handler gate, canSteer precedent); scoped admins read-only within scope. Prompt/script edit and run-now are unattended-execution control — strictest tier until a need to loosen appears."
    rejected:
      - option: "Inherit requireAuth only (read-scope filter)"
        reason: "requireAuth does not gate actions; computeScopes grants no_filter to any global admin. Mutation gate must be explicit per handler."
      - option: "scoped-admin may mutate within own groups (steer parity)"
        reason: "Steer sends a message; this surface edits prompts and bash scripts that run unattended with scoped credentials. Defer loosening until needed."
    constraint_refs: [C4]
    affects_groups: []
  - id: D8
    stage: brief
    description: "Cross-credential-boundary moves (security review MUST-FIX)"
    chosen: "Move confirm surfaces the OneCLI secret-scope delta (per-group onecliSecrets ∪ workgroup baseline, gains and losses); cross-workgroup moves require explicit boundary-crossing confirm; confirm states the pre-task script will execute in the target container's environment."
    rejected:
      - option: "Rely on scheduleTask wiring validation alone"
        reason: "Wiring check (scheduled-tasks.ts:155-163) validates output routing only; it is blind to credential scope."
    constraint_refs: [C2]
    affects_groups: []
  - id: D9
    stage: brief
    description: "Thread-scoped loops on the board (Codex review MUST-FIX)"
    chosen: "Visible + badged thread-bound; pause/resume/cancel allowed (existing calling-session-then-channel-root resolution); NOT movable in v1 — lifecycle intentionally bound to the thread."
    rejected:
      - option: "Allow moving thread-scoped loops"
        reason: "scheduleTask resolves channel-root sessions; a move would silently change the loop's lifecycle contract (lives/dies with thread)."
    constraint_refs: [C2]
    affects_groups: []

waivers: []

assumptions:
  - id: A1
    stage: brief
    text: "RESOLVED (was: siblings wired to same channels). Live query 2026-06-11: siblings reach the same physical channel via their OWN messaging-group rows — same platform_id, sibling channel_type variant (discord vs discord-codex vs discord-opencode). Moves to siblings need no new wiring, but the board must translate destination channel_type to the target group's variant."
    validation: "Queried messaging_group_agents x messaging_groups for main/discord-codex/main-opencode."
    validated: true
    invalidated_at: null

  - id: D10
    stage: design
    description: "Read-side architecture"
    chosen: "On-demand sweep of session DBs, setImmediate-chunked (one session per tick), single-flight, 5s in-process TTL cache, busy_timeout=1000 read-only opens; own-mutation synchronous invalidation."
    rejected:
      - option: "Materialized scheduled_index table refreshed by host-sweep"
        reason: "Second copy of scheduling state that can silently drift — both prior incidents were derived-state-diverged-from-truth failures; write load for an occasionally-open view."
      - option: "Synchronous in-handler assembly (rev 1)"
        reason: "better-sqlite3 blocks the shared host event loop — would stall delivery polls and SSE during assembly (perf review MUST-FIX)."
    constraint_refs: [C1, C5]
    affects_groups: []
  - id: D11
    stage: design
    description: "Mutation API shape"
    chosen: "Resource + verb endpoints under /dashboard/api/scheduled (9 routes); :key = base64url locator (never authz); touched==0 → 409 stale_key."
    rejected:
      - option: "Single RPC endpoint {op, key, args}"
        reason: "Per-verb authz gates degenerate into a switch; foreign to the existing route table."
    constraint_refs: [C4, C7]
    affects_groups: []
  - id: D12
    stage: design
    description: "Board layout"
    chosen: "Health strip + grouped list + detail drawer (Layout 2); drawer carries overrides (quietStatus/flagIntent), history, audit tail, verbs. [RENDER-CHECK NEEDED] on health-pill palette."
    rejected:
      - option: "Health-lane kanban mirroring InboxBoard"
        reason: "Degenerate columns (healthy ≈ 90% of rows) and lanes hide the group-by-agent-group scanning axis."
    constraint_refs: [C4]
    affects_groups: []
  - id: D13
    stage: design
    description: "Script preservation on move"
    chosen: "Extend TaskDef with optional script field + include in scheduleTask content assembly (covers insert AND seriesId-upsert paths; existing callers unaffected — verified bootstrap.ts omits it)."
    rejected:
      - option: "Post-insert updateTask re-merge of script"
        reason: "Window where an imminent-process_after row could fire scriptless."
    constraint_refs: [C1, C2]
    affects_groups: []
  - id: D14
    stage: design
    description: "Move compensation policy (Codex HIGH finding)"
    chosen: "Cancel-first; never delete a successfully-inserted target during compensation (target-live = fail-closed partial state); double-failure writes durable move_restore_failed repair record to scheduled_audit, surfaced as stalled on the board."
    rejected:
      - option: "Insert-first"
        reason: "Failure mode is double-fire — the incident class the feature exists to prevent."
      - option: "Delete target on any compensation"
        reason: "Double-failure would leave zero live rows with recurrence cleared everywhere — invisible to every read shape and to getCompletedRecurring."
    constraint_refs: [C2]
    affects_groups: []
  - id: D15
    stage: design
    description: "Provenance mechanism — brief amendment #1 (operator APPROVED 2026-06-12 with design rev 2)"
    chosen: "Minimal scheduled_audit table in central DB: hashed bodies (sha256), 512-char prompt previews, scripts hash-only, 90d sweep prune. Adopted because the brief's assumed content-stamp is mechanically impossible (updateTask whitelists prompt/script only, db.ts:96-98)."
    rejected:
      - option: "Content-stamp _cancelled/_audit into row content (brief's assumption)"
        reason: "No primitive can write arbitrary content keys; building one touches row content the firing path formats into prompts."
      - option: "Verbatim before/after bodies in audit"
        reason: "Creates a second long-lived plaintext copy of unattended-execution scripts (SEC-3)."
    constraint_refs: [C3]
    affects_groups: []
  - id: D16
    stage: design
    description: "Skipped-vs-quiet fire history — brief amendment #2 (operator APPROVED 2026-06-12 with design rev 2)"
    chosen: "v1 merges script-gated and quiet runs under 'completed (no chat output)'; persisted fire-outcome record deferred to v2."
    rejected:
      - option: "Persist a script-gate outcome marker from the container"
        reason: "Touches firing-path write semantics (C1); processing_ack status values are read by host sync."
    constraint_refs: [C1]
    affects_groups: []
  - id: D17
    stage: design
    description: "Authorization tier for move/preview (security MUST-FIX)"
    chosen: "move/preview gated at mutation tier (canManageScheduled) — it returns vault secret NAMES for an attacker-suppliable targetAgentGroupId; execute re-runs authz/scope/delta independent of preview (deltaHash echo, 409 delta_changed)."
    rejected:
      - option: "Preview at read tier (literal reading of 'mutation handlers')"
        reason: "Scoped admin could enumerate any group's secret-name set via the target body param — read filter never sees it."
    constraint_refs: [C4, C7]
    affects_groups: []
  - id: D18
    stage: design
    description: "Session-DB compound index (perf MUST-FIX)"
    chosen: "idx_messages_in_series_seq (series_id, seq DESC) via migrateMessagesInTable — makes MAX(seq) and history LIMIT-5 pure index lookups."
    rejected:
      - option: "No index (rely on idx_messages_in_series)"
        reason: "Per-series history materializes + sorts all rows; grows unboundedly with fleet history."
    constraint_refs: [C1, C5]
    affects_groups: []

assumptions_design:
  - id: A2
    stage: design
    text: "Series-prefix registry + static map covers all 22 module-owned series."
    validation: "Cross-check live fleet during build."
    validated: false
    invalidated_at: null
  - id: A3
    stage: design
    text: "Chunked assembly completes in low hundreds of ms warm (1.5s CLI figure included tsx startup)."
    validation: "Measure in-process during build; revisit chunk size if >1s."
    validated: false
    invalidated_at: null

