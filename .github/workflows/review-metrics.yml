# Weekly review-quality time series — docs/specs/risk-based-review/plan.md,
# "Measurement". Runs scripts/review-outcomes.ts's `--weekly` mode and posts ONE
# comment per run on the "Review metrics (weekly)" tracking issue (label
# `review-metrics`), so the ~2026-10-10 check (30 days after the switch to
# risk-scoped review) has a comparable weekly series on record rather than a
# single retroactive read.
#
# Triggers: the weekly schedule, and `workflow_dispatch` for an on-demand run
# (e.g. re-posting after a labeler.yml change). Both are pinned to `main`: the
# `if:` accepts a scheduled run unconditionally (schedule always fires against
# the default branch) or a dispatch run only when `github.ref` is
# `refs/heads/main` — dispatching this workflow from any other ref (a branch
# that also edits this file) never posts to the tracking issue. `checkout`
# pins `ref: main` for the same reason a dispatch from elsewhere must still
# read and run main's own copy of the script, not the dispatching ref's.
#
# Permissions: `contents: read` to check out the repo and let
# scripts/review-outcomes.ts read `.github/labeler.yml` via the GitHub API
# (`gh api repos/.../contents/...`), `issues: write` to post the comment, and
# `pull-requests: read` — not in the brief's original two-permission list, but
# `gh pr list` (fetchMergedPRs, fetchShadowReviewFailedPRs,
# fetchShadowReviewedPRs — every PR-reading call the script makes) 403s
# without it once a `permissions:` block is declared at all; shadow-review.yml
# and main-provenance.yml's own `analyze`/`provenance` jobs already carry this
# same scope for the same reason. No Claude/Anthropic token anywhere in this
# workflow — only the default `GITHUB_TOKEN` (`github.token`), read via `gh`'s
# own `GH_TOKEN` env convention.
#
# Budget: this repo is on a private-plan Actions quota (see ci.yml's own
# comment on the same constraint). `--weekly-days` defaults to 90, bounding
# the fetch to roughly 13 weeks of PR history rather than this repo's full
# lifetime, and `--json` computes the weekly rows, the cumulative before/after
# comparison, AND the ready-to-post markdown in the SAME fetch (see
# `renderWeeklyMarkdown` / the `main()` weekly branch in
# scripts/review-outcomes.ts) — one `gh`-fetching process, not two.
#
# The at-merge replay (resolveAtMergeContexts, for the post-gate reviewed/skipped
# split) reads every post-gate PR's base commit and merge-commit diff from LOCAL git
# (`fetch-depth: 0` below), never GitHub's REST `compare`/`contents` endpoints — those
# cost 2 REST calls per post-gate PR, which measured at 114s of a 143s full run for 72
# PRs (2026-09-12) and would cross this job's `timeout-minutes: 5` around 170-190
# post-gate PRs, and `GITHUB_TOKEN`'s 1,000-REST-requests/hour budget around 480 — both
# reachable within weeks at this repo's throughput, well before the 2026-10-10 read.
# Only labels-as-of-merge still goes over `gh api graphql` (GitHub-only data, no local
# equivalent), batched across PRs. Measured after the local-git rewrite: the same
# 72-PR run in well under a minute, zero REST calls for file/glob data.

name: Review metrics (weekly)

on:
  schedule:
    # Monday 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: review-metrics-weekly
  # false, not true: a manual workflow_dispatch (say, re-posting after a labeler.yml
  # change) must never cancel the scheduled Monday run that's already in flight and
  # about to post the week's only comment — same reasoning as main-provenance.yml's
  # `sweep` job, which never cancels itself for the same reason. A superseded run here
  # would mean a missed week's data, not just wasted minutes.
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          # Full history, not the default shallow depth-1 clone: the at-merge replay
          # (scripts/review-outcomes.ts's resolveAtMergeContexts) reads every post-gate
          # PR's base commit and merge-commit diff straight from LOCAL git — `git show
          # <base>:.github/labeler.yml`, `git diff --name-status -M <base> <merge>` —
          # zero REST calls either way. A shallow clone would make every one of those
          # commits "not resolvable locally" (see mergeCommitParentsLocal's own
          # fail-closed handling), turning every post-gate PR unresolved.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute the weekly review-metrics report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/review-outcomes.ts --weekly --json > /tmp/review-metrics.json
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/review-metrics.json', 'utf8'));
            fs.writeFileSync('/tmp/review-metrics.md', report.markdown);
          "

      - name: Post the weekly comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Found by label, not a hardcoded number: the tracking issue is created once,
          # by hand (see the PR body / docs/specs/risk-based-review/plan.md), and this
          # workflow only ever needs to find it again.
          issue=$(gh issue list --repo "$REPO" --label review-metrics --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            echo "::error::no OPEN issue labeled review-metrics found — create it once with: gh issue create -R $REPO --title \"Review metrics (weekly)\" --label review-metrics" >&2
            exit 1
          fi
          gh issue comment "$issue" --repo "$REPO" --body-file /tmp/review-metrics.md
