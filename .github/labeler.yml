# Risk-based review scope — the single source of truth for which PRs get Codex review.
#
# A PR that changes ANY path below is reviewed; everything else merges on green CI. The
# merge gate (container/skills/pr-review-loop/scripts/codex-review.sh, `scope` and
# `merge-check`) matches the PR's changed files against the `risk:high` globs itself,
# reading this file from the base branch. .github/workflows/risk-label.yml puts the same
# answer on the PR as the `risk:high` label for people to read, and a missing label never
# skips review. Rationale, audit data and rollback condition:
# docs/specs/risk-based-review/plan.md.
#
# Rule for adding a path: a mistake there is privileged, irreversible, or silently
# breaks every session — AND no deterministic gate already covers it. Upstream-owned
# files are deliberately absent: the upstream ratchet already gates them in CI.
#
# `risk:high` is the union of every path below and the only list the merge gate matches.
# Alongside it, each path also carries a `risk:<dimension>` label (guard,
# message-path, sweep, session-db, self-mod, credential, migration, supply-chain,
# deploy, gates, runner) so a reviewer can see which seam a PR touches without reading
# the whole diff; `scripts/labeler-config.test.ts` asserts the two stay in sync. Keep
# `risk:high` in the one shape the gate reads — one rule holding one
# `any-glob-to-any-file` list of quoted globs that use only `*` and `**` — or every
# PR fails closed to review; `scripts/risk-scope.test.ts` checks this file against it.
#
# Replayed against PRs #510–#595 on 2026-09-10 (measured before the dimension labels
# and the risk:runner/message-path/gates/supply-chain additions below): 18 of 60 (30%)
# would be reviewed.
# `sync-labels: true` removes a label when a later push stops touching its paths.
# To request review on a PR this file does not select, add `review:requested` by hand —
# never `risk:high`, which is machine-owned and would be removed on the next sync.

risk:high:
- changed-files:
  - any-glob-to-any-file:
    # Privileged-action decision seams (host + container) — named *guard* by convention
    - 'src/**/*guard*.ts'
    - 'container/agent-runner/src/**/*guard*.ts'
    - 'src/guard/**'
    # ...and the approval gates named otherwise: destructive/bash commands, held a2a messages
    - 'src/modules/bash-gate/**'
    - 'src/modules/agent-to-agent/message-gate.ts'
    - 'src/command-gate.ts'
    # The message path, both ends
    - 'src/router.ts'
    - 'src/delivery.ts'
    - 'container/agent-runner/src/admission-gate.ts'
    # Everything on a timer — the sweep plus the modules it was decomposed into
    - 'src/host-sweep.ts'
    - 'src/modules/sweep-scheduling/**'
    # Session DBs: the sole host<->container IO surface
    - 'src/modules/mailbox/**'
    - 'src/mailbox/sqlite/**'
    - 'container/agent-runner/src/mailbox/sqlite/**'
    - 'container/agent-runner/src/db/**'
    - 'container/agent-runner/src/poll-loop.ts'
    # Agents editing their own container config
    - 'src/modules/self-mod/**'
    # Credential, identity and privilege scoping (onecliSecrets, cli_scope, mounts) and
    # who may approve a privileged action (approval cards, click authorization, roles)
    - 'src/onecli-secrets.ts'
    - 'src/container-config.ts'
    - 'src/container-runner.ts'
    - 'src/cli/dispatch.ts'
    - 'src/cli/registry.ts'
    - 'src/modules/approvals/**'
    - 'src/modules/permissions/**'
    - 'src/modules/interactive/choice.ts'
    - 'src/modules/channel-config/**'
    - 'src/dashboard/auth/**'
    - 'src/dashboard/api/auth-me.ts'
    - 'src/dashboard/db/dashboard-tokens.ts'
    - 'src/dashboard/steer.ts'
    - 'src/dashboard/assign.ts'
    - 'src/dashboard/api/scheduled-shared.ts'
    - 'src/dashboard/thread-close.ts'
    - 'src/dashboard/thread-snooze.ts'
    # The remaining dashboard authorization seams from #651's retro review of #624:
    # who may act on a Signal decision (globalAdmin/canReview), the guarded
    # observatory.signal.mutate action and its demand() call sites, requireAuth's
    # CSRF/cookie gate in front of every dashboard handler, and the canSteer gate
    # thread-message.ts runs before it can create a session as a side effect.
    - 'src/dashboard/observatory-v2/sources.ts'
    - 'src/dashboard/observatory-v2/api.ts'
    - 'src/dashboard/router.ts'
    - 'src/dashboard/thread-message.ts'
    # #651 round 2 — the seams #651's own follow-up comment named as still open: gates
    # that decide who may act (requireAuth's per-route wiring, the SSE feed's
    # per-connection scope filter, the two scheduled-task management gates, Signal
    # claim release, and dispatch-destination selection) and read-side scoping that
    # decides which groups'/workgroups' data a caller sees (the inbox/console/workgroup
    # list-and-detail endpoints, and the canAssign call sites that gate who a
    # nudge/steer may target).
    - 'src/dashboard/index.ts'
    - 'src/dashboard/api/events.ts'
    - 'src/dashboard/api/scheduled-mutations.ts'
    - 'src/dashboard/api/scheduled-move.ts'
    - 'src/dashboard/observatory-v2/state.ts'
    - 'src/dashboard/observatory-v2/destination.ts'
    - 'src/dashboard/api/sessions.ts'
    - 'src/dashboard/api/threads.ts'
    - 'src/dashboard/api/groups.ts'
    - 'src/dashboard/api/workgroups.ts'
    - 'src/dashboard/api/observatory.ts'
    - 'src/dashboard/api/scheduled-read.ts'
    - 'src/dashboard/api/scheduled-assembly.ts'
    - 'src/dashboard/nudge.ts'
    - 'src/dashboard/observatory-steer.ts'
    # #714 round 2 review, two more findings: issue-brief.ts's workgroup-scoped
    # GitHub fetch (observatoryIssueBriefHandler) never consults the caller's ctx at
    # all — it reads any requested workgroup's board and fetches with that
    # workgroup's own token, so a signed-in member scoped to one workgroup could read
    # another workgroup's private issue body. The leak itself is fixed in its own
    # security PR (a hasWorkgroupAccess check, same shape as api/observatory.ts's),
    # but the file belongs on this list regardless of who reads it next. And
    # messaging-groups.ts's own header names its global, unscoped list a deliberate
    # choice (messaging groups aren't authz-scoped the way agent_group_ids are) — a
    # visibility decision worth review even though it is intentional, not a bug.
    - 'src/dashboard/issue-brief.ts'
    - 'src/dashboard/api/messaging-groups.ts'
    # Deliberately NOT on this list: 'src/dashboard/static.ts' (public SPA asset
    # handler — path-containment only, no authorization decision), 'observatory-v2/
    # types.ts' (pure interface declarations, no logic to cover), the attention/sweep/
    # idempotency files ('api/attention-fs.ts', 'api/board-attention.ts',
    # 'api/desk-attention.ts', 'session-title-sweep.ts', 'db/steer-idempotency.ts' —
    # file-read item producers, a title-generation sweep, and a request-dedupe cache,
    # none of which decide who may act or what they may see), 'webhook-server.ts'
    # (HTTP transport plumbing only — it delegates all routing/dispatch to router.ts,
    # which is already on this list), 'api/scheduled-board-matrix.ts' (the verb x
    # health-state availability matrix — health/claim/due facts in, an available-verb
    # list out, no caller identity or role ever enters it), and 'db/item-assignments.ts'
    # (plain CRUD on the item-reservation table — reserve/release/read by workgroup
    # and item id, no ctx or role check anywhere in it either).
    # Irreversible against a live DB
    - 'src/db/migrations/**'
    # Supply chain: pnpm allowBuilds, and the container image it builds
    - 'pnpm-workspace.yaml'
    - 'container/Dockerfile'
    - 'container/build.sh'
    # Deploy and rollback (src/deploy-crash-guard.ts is covered by *guard*), and the
    # nightly host snapshot that scans for secrets then pushes config to a remote
    # (and its selfcheck, covered by the * glob), off secret-scan.sh's pattern set
    # (a weakened pattern there silently disables the scan)
    - 'scripts/deploy.sh'
    - 'scripts/git-safety*.sh'
    # The pre-push secret-scan hook agents' own containers run when pushing a wiki repo
    # (and its selfcheck) — a weakened pattern here silently lets a secret reach a real
    # remote with no other gate on that path at all
    - 'scripts/wiki-pre-push-hook*.sh'
    - 'scripts/lib/secret-scan.sh'
    # Host-side refresh/integrity-check/mount-decision for the hook above — a bug here
    # either mounts a stale or tampered hook, or silently drops the scan for a wiki repo
    - 'src/managed-git-hooks.ts'
    # The gates themselves: CI workflows, this file, the git hooks, the public-boundary
    # checkers and allowlist, and the PR review loop that IS the review gate. CI runs
    # only the portable boundary mode, so the strict identifier check runs only in the
    # hooks and the daily remote scan.
    - '.github/**'
    - '.husky/**'
    - 'scripts/check-public-boundary.ts'
    - 'scripts/check-remote-boundary.ts'
    - '.public-boundary-allowlist.json'
    - 'container/skills/pr-review-loop/**'
    - 'docs/review-policy.md'
    # The reviewer-eligibility tier rule the merge gate enforces: the generator,
    # the worker-tier agent defs it derives Claude ids from, and the Codex tier
    # map (CODEX_WORKER_TIERS) it imports rather than reparses. A change to any
    # of these changes who is allowed to approve a merge.
    - 'scripts/reviewer-models*.ts'
    - 'container/agents/**'
    - 'src/claude-agent-md.ts'
    # Executable agent and tool config: a hook (.claude/settings.json), an
    # auto-trusted MCP server (.mcp.json — any agent/CI tooling that honors
    # enableAllProjectMcpServers connects to it with no prompt), Claude Code's own
    # project trust/onboarding state (.claude.json), a ripgrep config (.ripgreprc —
    # the claude-code-action's own restore-config.ts:26-35 SENSITIVE_PATHS list
    # names it alongside these, i.e. Anthropic's own threat model treats it as
    # sensitive project config, not just prose), or a submodule URL (.gitmodules,
    # which a clone/checkout can fetch from). All five merge unreviewed today and
    # run (or load) the moment something checks the tree out and runs Claude
    # Code against it with default settings — including, in principle,
    # .github/workflows/shadow-review.yml's own reviewer, which DOES check the
    # tree out (required — see that file's top comment for why a no-checkout
    # design doesn't work against this action) but neutralizes them via
    # `--setting-sources user` and `--strict-mcp-config` in its `claude_args`.
    # CLAUDE.local.md is on that same SENSITIVE_PATHS list but deliberately NOT
    # here: .gitignore:29 (`**/CLAUDE.local.md`) means it can never appear in a
    # PR diff, so this rule would never fire. Plain CLAUDE.md is also NOT on
    # this list: it changes often enough that flagging every edit has a real
    # review cost, and shadow-review.yml's own reviewer already suppresses it via
    # `--setting-sources user` — see that file's top comment.
    - '.claude/**'
    - '.mcp.json'
    - '.claude.json'
    - '.ripgreprc'
    - '.gitmodules'
    # The agent-runner boot snapshot mounted read-only into every group, and its MCP
    # tool surface
    - 'src/agent-runner-source.ts'
    - 'src/group-init.ts'
    - 'container/agent-runner/src/mcp-tools/**'
    # The coverage-ratchet baseline (docs/specs/risk-based-review/plan.md, "Tests on
    # risky paths") AND the script that enforces it: scripts/check-risk-coverage.ts
    # fails closed on a missing baseline, but a PR could still delete tests and
    # `--write` a new, lower baseline over the old one unreviewed if the baseline file
    # were not itself on risk:high — and a bug in the script itself (main() computed
    # `allowNew` inline and every test stayed green when it was flipped to
    # unconditionally true) could silently let an unfloored risk file merge with no
    # review at all if the script were not on risk:high too (#714 round 2, P2-B).
    - 'coverage-risk-baseline.json'
    - 'scripts/check-risk-coverage.ts'

