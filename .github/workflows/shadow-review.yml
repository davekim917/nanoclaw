name: Shadow review

# Post-merge advisory review of a PR that merged into main WITHOUT going through
# Codex review — i.e. one that carried neither `risk:high` nor `review:requested` at
# merge time. `github.event.pull_request.labels` on a `closed` event is the label
# snapshot at that instant, which IS "at merge time" — no separate lookup needed.
# docs/specs/risk-based-review/plan.md, "Measurement": this is the direct signal
# scripts/review-outcomes.ts's file-overlap heuristic was always meant to stand in for.
#
# Selection is by LABEL on purpose, not a recomputed risk-list replay: this review is
# advisory only — it files what it finds and never blocks (see the last step below) —
# so a wrongly-removed `risk:high` label only costs a redundant review, never a risky
# PR shipping unwatched. That asymmetry is what makes label-based selection safe here;
# it would NOT be safe if this workflow ever gated a merge, so it must not become one.
#
# Trust boundary: `pull_request_target` runs with repo secrets and a write token
# regardless of who opened the PR, so this job must never build or execute
# PR-supplied code. The checkout below pins `merge_commit_sha` — a commit already on
# `main`, reachable only through a merge GitHub performed — and NEVER the PR head
# (`github.event.pull_request.head.sha`). Do not add a step that checks that out.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: shadow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow-review:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'risk:high') &&
      !contains(github.event.pull_request.labels.*.name, 'review:requested')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Idempotent: creates the label on first run, no-ops (via --force, which updates
      # rather than errors) on every run after. Loud on failure — if this repo's token
      # can't manage labels, later steps that need the label would fail anyway.
      - name: Ensure the shadow-review label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create shadow-review \
            --repo "$REPO" \
            --color 5319E7 \
            --description "Findings from a post-merge advisory review of a PR that merged without review (docs/specs/risk-based-review/plan.md)" \
            --force

      # merge_commit_sha, never head.sha — see the trust-boundary note above. This ref
      # is already reachable from main, so nothing here executes PR-authored code that
      # wasn't already merged.
      - name: Checkout the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      # HEAD~1 is the merge commit's first parent, i.e. main's tip immediately before
      # this merge — true for a real merge commit (first-parent chain), a squash merge,
      # and a rebase merge alike, so one diff computation covers all three merge
      # methods GitHub offers.
      - name: Compute the PR's diff
        run: |
          set -euo pipefail
          git diff HEAD~1 HEAD -- . > "$RUNNER_TEMP/shadow-review.diff"
          bytes=$(wc -c < "$RUNNER_TEMP/shadow-review.diff")
          # Cap at 400KB (~100k tokens) so one unusually large PR can't blow the
          # review's context or its cost; it still gets a review, just a partial one.
          if [ "$bytes" -gt 400000 ]; then
            head -c 400000 "$RUNNER_TEMP/shadow-review.diff" > "$RUNNER_TEMP/shadow-review.diff.head"
            mv "$RUNNER_TEMP/shadow-review.diff.head" "$RUNNER_TEMP/shadow-review.diff.trunc"
            printf '\n... TRUNCATED at 400000 of %s bytes — review the visible portion only.\n' "$bytes" \
              >> "$RUNNER_TEMP/shadow-review.diff.trunc"
            mv "$RUNNER_TEMP/shadow-review.diff.trunc" "$RUNNER_TEMP/shadow-review.diff"
          fi

      # Read-only reviewer: no Bash/Write/Edit, so the worst a misleading diff or PR
      # metadata can do is produce a wrong REPORT, never touch the runner or the repo.
      # --json-schema turns the review into one validated `structured_output` field the
      # next (deterministic, non-Claude) step reads — Claude never calls the GitHub API
      # itself, so there is exactly one place that writes an issue or a comment.
      - name: Shadow review
        id: review
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1.0.221
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the shadow reviewer defined in docs/specs/risk-based-review/plan.md.
            PR #${{ github.event.pull_request.number }} merged into main WITHOUT a Codex
            review, because it did not touch a path on the risk list
            (.github/labeler.yml). Review it anyway, after the fact. This is advisory
            only — you never block anything, you only report what you find.

            1. Read docs/review-policy.md in this checkout (already at the merge commit)
               for the severity contract: what counts as a real finding, what its
               "Blocks — destructive" bar names, and what "Do not report" excludes.
            2. Read the PR's diff at ${{ runner.temp }}/shadow-review.diff.
            3. Classify each real finding:
               - **P1** — it matches docs/review-policy.md's "Blocks — destructive" bar
                 (data loss/corruption; money computed, moved or reported wrong; tenant
                 or scope isolation breached; auth or permission bypassed; credentials
                 exposed; a migration with no undo) OR is a fail-open in a security or
                 safety control.
               - **P2** — any other real, notable bug.
               Do NOT report anything docs/review-policy.md's "Do not report" section
               excludes (generated files, style a formatter already enforces,
               pre-existing defects outside this diff, anything a deterministic gate
               already covers).
            4. If nothing is worth reporting, return an empty findings array — do not
               manufacture a finding to have something to say.

            Cite file:line for every finding, and name the class it belongs to. Be
            precise and conservative: this feeds a program that moves a PR's paths onto
            the mandatory-review list on a real P1, so a false P1 has a real cost.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Write,Edit,WebSearch,WebFetch"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["P1","P2"]},"file":{"type":"string"},"line":{"type":["integer","null"]},"class":{"type":"string"},"description":{"type":"string"}},"required":["severity","file","description"]}}},"required":["findings"]}'

      # The only step that writes to GitHub. `scripts/review-outcomes.ts` reads these
      # issues back (buildShadowReviewIndex) to count skipped PRs that were reviewed and
      # the P1s among them — it matches on the exact title shape and the "**P1**" /
      # "**P2**" severity markers below, so don't change either without updating that
      # script's SHADOW_REVIEW_TITLE_RE / P1_RE.
      - name: File findings, or confirm none were found
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          findings_count=$(jq '.findings | length' <<<"$STRUCTURED_OUTPUT")
          if [ "$findings_count" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Shadow review (post-merge, advisory — docs/specs/risk-based-review/plan.md): no findings."
            exit 0
          fi
          body=$(jq -r '
            "Post-merge advisory review of a PR that merged without review (docs/specs/risk-based-review/plan.md). This never blocked the merge — it is filed after the fact.\n\n"
            + ([.findings[]
                | "- **\(.severity)** — \(.file)" + (if .line then ":\(.line)" else "" end)
                  + " — " + (.class // "finding") + ": " + .description
               ] | join("\n"))
          ' <<<"$STRUCTURED_OUTPUT")
          gh issue create --repo "$REPO" \
            --title "shadow review: #$PR_NUMBER $PR_TITLE" \
            --label shadow-review \
            --body "$body"
