auto_judgments:
  - stage: Review
    iteration: 1
    decision: "Relabel the two informal pre-approval reviewer passes from review_cycles to design_iteration_cycles; formal /team-review counting starts at this invocation (1/3)."
    alternatives_considered:
      - "Keep informal passes in review_cycles (this run = cycle 3/3, cap-reached escalation on any MUST-FIX)"
      - "Drop the informal history entirely"
    grounding:
      - "skills/shared/decision-record-schema.md — review_cycles: '/team-review | Append: review_cycles (one entry per invocation)'"
      - "team-review SKILL.md Step 5 — 'Append a new review_cycles entry with iteration = N+1' tied to running the three reviewers"
      - "Informal passes were ad-hoc Agent swarms commissioned directly by the operator before /team-auto was invoked; their findings are preserved in D6-D18"
    scope_check:
      adds_user_facing_capability: false
      changes_external_behavior: false
      changes_hard_constraint: false
      weakens_safety_invariant: false
    recorded_at: 2026-06-12T18:20:00Z
  - stage: Review
    iteration: 2
    decision: "Consolidate all verb guards into a single authoritative §4.0 verb×state matrix instead of patching the six guard contradictions individually."
    alternatives_considered:
      - "Patch each contradiction in place across §4.2/§4.6/§3b prose"
      - "Drop the unknown/late substates to reduce the state space"
    grounding:
      - "review.md cycle-2: A2#1/A2#2/A2#3 + C2#3/C2#6/C2#7 all root in guard logic scattered across sections (six findings, one generator)"
      - "design.md §4.6 vs §4.1 contradiction surfaced by /team-review reviewer A (stalled ⇒ process_after ≤ now ⇒ unconditional 409)"
    scope_check:
      adds_user_facing_capability: false
      changes_external_behavior: false
      changes_hard_constraint: false
      weakens_safety_invariant: false
    recorded_at: 2026-06-12T19:40:00Z
  - stage: Review
    iteration: 2
    decision: "Move guard tightened to 'paused OR process_after > now + grace' — removes the documented TOCTOU window entirely rather than accepting it."
    alternatives_considered:
      - "Keep the rev-3 due-now check with documented residual ms-window"
      - "Semantic lock (persisted in-progress marker on the source row)"
    grounding:
      - "C2#7 (residual window is the double-fire class the design protects against) + A2#2 (paused rows are safe to move regardless of slot)"
      - "best-practice-check cycle 2: lock-vs-check noted as accepted deviation; future-dated requirement achieves lock-equivalent safety without new state"
